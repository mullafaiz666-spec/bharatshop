name: Guarded database migration

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Use preflight for read-only checks. Apply performs the guarded copy."
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - apply
      confirmation:
        description: "For apply mode type exactly MIGRATE_RENDER_TO_SUPABASE"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: bharatshop-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify required private connections exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOURCE_DATABASE_URL:-}" || { echo "SOURCE_DATABASE_URL secret is missing"; exit 2; }
          test -n "${SUPABASE_DB_URL:-}" || { echo "SUPABASE_DB_URL secret is missing"; exit 2; }
          test "$SOURCE_DATABASE_URL" != "$SUPABASE_DB_URL" || { echo "Source and target URLs must differ"; exit 2; }

      - name: Read-only source and target preflight
        run: node scripts/database-migration-preflight.mjs

      - name: Stop after read-only preflight
        if: ${{ inputs.mode == 'preflight' }}
        run: echo "Read-only preflight passed. No database writes were performed."

      - name: Require explicit migration confirmation
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "MIGRATE_RENDER_TO_SUPABASE" || {
            echo "Apply mode refused: confirmation text does not match.";
            exit 3;
          }

      - name: Install PostgreSQL client
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          pg_dump --version
          pg_restore --version

      - name: Re-check target immediately before writes
        if: ${{ inputs.mode == 'apply' }}
        run: node scripts/database-migration-preflight.mjs

      - name: Dump source and current target to ephemeral runner storage
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          source_dump="$RUNNER_TEMP/bharatshop-source.dump"
          target_dump="$RUNNER_TEMP/bharatshop-target-before.dump"

          pg_dump "$SOURCE_DATABASE_URL" \
            --format=custom \
            --schema=public \
            --no-owner \
            --no-privileges \
            --file="$source_dump"

          pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --schema=public \
            --no-owner \
            --no-privileges \
            --file="$target_dump"

          test -s "$source_dump"
          test -s "$target_dump"
          echo "Source and target safety dumps exist only in ephemeral runner storage and will not be uploaded."

      - name: Replace only the known empty Supabase starter tables
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          do $$
          declare
            unexpected text[];
            nonempty text[];
          begin
            select coalesce(array_agg(c.relname order by c.relname), '{}')
              into unexpected
            from pg_class c
            join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public'
              and c.relkind in ('r','p')
              and c.relname not in ('order_items','orders','products','profiles');
            if cardinality(unexpected) > 0 then
              raise exception 'Unexpected public tables exist: %', unexpected;
            end if;

            select coalesce(array_agg(name order by name), '{}')
              into nonempty
            from (
              select 'order_items' as name where exists (select 1 from public.order_items limit 1)
              union all select 'orders' where exists (select 1 from public.orders limit 1)
              union all select 'products' where exists (select 1 from public.products limit 1)
              union all select 'profiles' where exists (select 1 from public.profiles limit 1)
            ) q;
            if cardinality(nonempty) > 0 then
              raise exception 'Target starter tables are no longer empty: %', nonempty;
            end if;
          end $$;

          drop table public.order_items cascade;
          drop table public.orders cascade;
          drop table public.products cascade;
          drop table public.profiles cascade;
          commit;
          SQL

      - name: Restore source public schema and data into Supabase
        id: restore_source
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          pg_restore \
            --dbname="$SUPABASE_DB_URL" \
            --no-owner \
            --no-privileges \
            --exit-on-error \
            --single-transaction \
            "$RUNNER_TEMP/bharatshop-source.dump"

      - name: Recover original Supabase starter schema if source restore failed
        if: ${{ always() && inputs.mode == 'apply' && steps.restore_source.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/bharatshop-target-before.dump"
          pg_restore \
            --dbname="$SUPABASE_DB_URL" \
            --no-owner \
            --no-privileges \
            --exit-on-error \
            --single-transaction \
            "$RUNNER_TEMP/bharatshop-target-before.dump"
          echo "Source restore failed; the prior empty Supabase starter schema was restored. Production traffic was never switched."

      - name: Lock migrated public tables away from direct Data API roles
        if: ${{ inputs.mode == 'apply' && steps.restore_source.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare r record;
          begin
            for r in
              select c.relname
              from pg_class c
              join pg_namespace n on n.oid=c.relnamespace
              where n.nspname='public' and c.relkind in ('r','p')
            loop
              execute format('alter table public.%I enable row level security', r.relname);
            end loop;
          end $$;
          revoke all on all tables in schema public from anon, authenticated;
          revoke all on all sequences in schema public from anon, authenticated;
          revoke execute on all functions in schema public from anon, authenticated;
          SQL

      - name: Verify exact table/schema/content/sequence parity
        if: ${{ inputs.mode == 'apply' && steps.restore_source.outcome == 'success' }}
        run: node scripts/verify-supabase-copy.mjs

      - name: Migration result
        if: ${{ inputs.mode == 'apply' && steps.restore_source.outcome == 'success' }}
        run: |
          echo "Source public schema/data copy verified."
          echo "Production traffic was NOT switched. Render remains authoritative until final acceptance and cutover approval."
