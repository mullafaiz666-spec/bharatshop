name: Repair workstation Next dependency
on:
  push:
    branches: [integration/jarvis-bharatshop-gateway-20261001]
    paths: [.github/workflows/repair-workstation-next.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/jarvis-bharatshop-gateway-20261001
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate lockfile for patched framework and matching lint config
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.3.8 eslint-config-next@16.3.8
      - name: Commit only dependency manifests to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Patch Next.js critical vulnerability with 16.3.8"
          git push origin HEAD:integration/jarvis-bharatshop-gateway-20261001
      - run: npm ci
      - name: Security audit
        run: npm audit --audit-level=critical
      - name: Integration tests
        if: ${{ !cancelled() }}
        run: npm run test:integrations
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
