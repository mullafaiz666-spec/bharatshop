name: Agent Suite Build
on:
  push:
    branches: [main, feat/agent-suite]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Reject critical dependency vulnerabilities
        run: npm audit --audit-level=critical
      - run: npm run test:integrations
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
