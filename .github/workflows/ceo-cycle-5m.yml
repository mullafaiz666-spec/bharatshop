name: BharatShop CEO Cycle (5m)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bharatshop-ceo-cycle
  cancel-in-progress: true

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production health
        env:
          BHARATSHOP_URL: ${{ secrets.BHARATSHOP_URL }}
        run: |
          set -euo pipefail
          test -n "$BHARATSHOP_URL"
          curl --silent --show-error --fail-with-body --retry 3 --retry-delay 5 "$BHARATSHOP_URL/api/health"
          curl --silent --show-error --fail-with-body --retry 3 --retry-delay 5 "$BHARATSHOP_URL/api/storefront/products?limit=1"

      - name: Run CEO cycle and delegated operations
        env:
          BHARATSHOP_URL: ${{ secrets.BHARATSHOP_URL }}
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BHARATSHOP_URL"
          test -n "$BHARATSHOP_AUTOMATION_TOKEN"
          AUTH=(-H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" -H "x-automation-token: $BHARATSHOP_AUTOMATION_TOKEN" -H "Content-Type: application/json")
          curl --silent --show-error --fail-with-body --retry 3 --retry-delay 5 -X POST "$BHARATSHOP_URL/api/automation/ceo-cycle" "${AUTH[@]}" --data '{}'
          curl --silent --show-error --fail-with-body --retry 3 --retry-delay 5 -X POST "$BHARATSHOP_URL/api/automation/ceo-delegation" "${AUTH[@]}" --data '{}'
