name: BharatShop Autonomous Streetwear Designer

on:
  schedule:
    - cron: "50 4 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Trend-led BharatDrip drops to create (1-6)"
        required: false
        default: "3"
  push:
    branches: [main]
    paths:
      - "src/app/api/automation/streetwear-fashion-agent/**"
      - "src/lib/fashion/trend-intelligence.ts"
      - "src/lib/suppliers/qikink-rate-card.ts"
      - ".github/workflows/streetwear-fashion-agent.yml"

concurrency:
  group: bharatshop-autonomous-streetwear
  cancel-in-progress: true

env:
  BHARATSHOP_URL: https://bharatshop-35fd.netlify.app

jobs:
  design-and-list:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for compatible Netlify production revision
        run: |
          set -euo pipefail
          for i in $(seq 1 42); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$BHARATSHOP_URL/api/health" || true)
            revision=$(node -e "try{const d=require('/tmp/health.json');process.stdout.write(String(d.revision||''))}catch{}")
            echo "health=$code revision=$revision event=$GITHUB_EVENT_NAME required=$GITHUB_SHA"
            if [ "$code" = "200" ]; then
              if [ "$GITHUB_EVENT_NAME" != "push" ]; then exit 0; fi
              if [ -n "$revision" ] && [ "$revision" = "$GITHUB_SHA" ]; then exit 0; fi
              if [ -n "$revision" ]; then
                git fetch --quiet --no-tags origin "$revision" || true
                if git cat-file -e "$revision^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$revision"; then
                  echo "Netlify is on descendant revision $revision containing required commit $GITHUB_SHA"
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "Netlify did not expose the required streetwear agent revision"
          exit 1

      - name: Run autonomous streetwear designer
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
          DESIGN_COUNT: ${{ inputs.count || '3' }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          count="$DESIGN_COUNT"
          if [ "$count" -lt 1 ] 2>/dev/null; then count=1; fi
          if [ "$count" -gt 6 ] 2>/dev/null; then count=6; fi
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/automation/streetwear-fashion-agent" \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-automation-token: $TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"count\":$count,\"publish\":true}" | tee streetwear-agent-result.json
          node - <<'NODE'
          const d=require('./streetwear-agent-result.json');
          if(!d.success) throw new Error(d.error||'streetwear agent failed');
          const ok=(d.results||[]).filter(x=>x.productId||x.duplicate);
          if(!ok.length) throw new Error('No trend-led products were created or already live');
          const bad=(d.results||[]).filter(x=>x.productId && (Number(x.marginPct)<30 || Number(x.profitInr)<200));
          if(bad.length) throw new Error(`Profitability gate escaped for ${bad.length} products`);
          console.log(JSON.stringify({generated:d.generated,trendStatus:d.trendStatus,products:ok.map(x=>({id:x.productId,title:x.title,status:x.status,trend:x.trend,garment:x.garment,marginPct:x.marginPct}))},null,2));
          NODE

      - name: Verify BharatDrip storefront
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --max-time 120 \
            "$BHARATSHOP_URL/api/storefront/products?category=BharatDrip%20Streetwear&limit=24" | tee bharatdrip-storefront.json
          node - <<'NODE'
          const d=require('./bharatdrip-storefront.json');
          const rows=(d.products||[]).filter(x=>String(x.brand)==='BharatDrip');
          if(!rows.length) throw new Error('No BharatDrip products are customer-visible');
          if(rows.some(x=>!Array.isArray(x.imageUrls)||!x.imageUrls.length)) throw new Error('A BharatDrip product is missing product imagery');
          const invalid=rows.flatMap(x=>x.imageUrls||[]).filter(url=>!/^https:\/\//i.test(String(url))||/\/\/(?:0\.0\.0\.0|127\.0\.0\.1|localhost)(?::|\/)/i.test(String(url)));
          if(invalid.length) throw new Error(`Storefront has non-public product imagery: ${invalid.slice(0,3).join(', ')}`);
          console.log(JSON.stringify({visible:rows.length,products:rows.slice(0,8).map(x=>({id:x.id,title:x.title,price:x.sellingPriceInr,brand:x.brand}))},null,2));
          NODE
