name: One-shot Security Dependency Refresh

on:
  push:
    branches: [fix/production-readiness-20260911]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-readiness-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh patched framework dependencies and lockfile
        run: |
          npm install --save-exact next@16.3.4
          npm install --save-dev --save-exact eslint-config-next@16.3.4 postcss@8.5.23
      - name: Verify critical advisories are cleared
        run: npm audit --audit-level=critical
      - run: npm run test:integrations
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - name: Commit regenerated dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
          else
            git commit -m "Refresh security dependencies"
            git push origin HEAD:fix/production-readiness-20260911
          fi
