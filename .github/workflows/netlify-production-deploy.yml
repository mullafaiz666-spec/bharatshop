name: Deploy BharatShop to Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "netlify.toml"
      - ".github/workflows/netlify-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

env:
  NETLIFY_SITE_ID: 75b5c168-6679-479d-b3a6-244e393fe1b0
  NETLIFY_SITE_TARGET: bharatshop-35fd.netlify.app
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_PERSONAL_ACCESS_TOKEN || secrets.NETLIFY_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4

      - name: Use linked Netlify Git integration when CLI token is absent
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' }}
        run: |
          echo "No GitHub Netlify CLI token is configured."
          echo "Skipping duplicate CLI deployment instead of failing the workflow."

      - name: Verify Netlify token and BharatShop site access
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          user_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            https://api.netlify.com/api/v1/user)
          site_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
          echo "NETLIFY_USER_HTTP=$user_code"
          echo "BHARATSHOP_SITE_HTTP=$site_code"
          if [ "$user_code" != "200" ]; then
            echo "Netlify token is not valid for the API."
            exit 21
          fi
          if [ "$site_code" != "200" ]; then
            echo "Netlify token is valid but cannot access the BharatShop project."
            exit 22
          fi

      - name: Set up Node.js for token-backed CLI deployment
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install project dependencies for CLI deployment
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        run: npm ci --no-audit --no-fund

      - name: Deploy production to existing Netlify site with CLI token
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        shell: bash
        run: |
          npx -y netlify-cli@27.5.2 deploy \
            --build \
            --prod \
            --site "$NETLIFY_SITE_TARGET" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --message "BharatShop production ${GITHUB_SHA}"
