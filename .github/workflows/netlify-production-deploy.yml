name: Deploy BharatShop Netlify Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

env:
  NETLIFY_SITE_URL: https://bharatshop-35fd.netlify.app
  NETLIFY_SITE_ID: 75b5c168-6679-479d-b3a6-244e393fe1b0
  NETLIFY_SITE_NAME: bharatshop-35fd

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_PERSONAL_ACCESS_TOKEN: ${{ secrets.NETLIFY_PERSONAL_ACCESS_TOKEN }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Require the exact BharatShop Netlify target
        shell: bash
        run: |
          set -euo pipefail
          readable=0
          for candidate in "${NETLIFY_AUTH_TOKEN:-}" "${NETLIFY_PERSONAL_ACCESS_TOKEN:-}" "${NETLIFY_TOKEN:-}"; do
            [ -z "$candidate" ] && continue
            echo "::add-mask::$candidate"
            if curl -fsS \
              -H "Authorization: Bearer ${candidate}" \
              "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" \
              -o /tmp/netlify-site.json; then
              readable=1
              break
            fi
          done
          if [ "$readable" != "1" ]; then
            echo 'No configured Netlify token can read the BharatShop production site.' >&2
            exit 21
          fi
          node -e 'const fs=require("fs");const site=JSON.parse(fs.readFileSync("/tmp/netlify-site.json","utf8"));const expectedName=process.env.NETLIFY_SITE_NAME;const expectedUrl=process.env.NETLIFY_SITE_URL;if(site.id!==process.env.NETLIFY_SITE_ID)throw new Error(`Refusing deployment: unexpected Netlify site id ${site.id||"missing"}`);if(site.name!==expectedName)throw new Error(`Refusing deployment: expected Netlify site ${expectedName}, got ${site.name||"unknown"}`);const url=String(site.ssl_url||site.url||"").replace(/\/$/,"");if(url!==expectedUrl)throw new Error(`Refusing deployment: expected ${expectedUrl}, got ${url||"missing"}`);console.log(`Verified Netlify target: ${site.name} (${site.id})`);'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run integration tests
        run: npm run test:integrations

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          BHARATSHOP_BUILD_REVISION: ${{ github.sha }}
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Trigger Git-linked Netlify production build
        shell: bash
        run: |
          set -euo pipefail
          success=0
          attempt=0
          for candidate in "${NETLIFY_PERSONAL_ACCESS_TOKEN:-}" "${NETLIFY_TOKEN:-}" "${NETLIFY_AUTH_TOKEN:-}"; do
            [ -z "$candidate" ] && continue
            attempt=$((attempt + 1))
            echo "::add-mask::$candidate"
            echo "Trying configured Netlify build credential #${attempt}."
            http=$(curl -sS -o /tmp/netlify-build.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${candidate}" \
              -H "Content-Type: application/json" \
              --data '{}' \
              "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/builds" || true)
            if [ "$http" -ge 200 ] 2>/dev/null && [ "$http" -lt 300 ] 2>/dev/null; then
              echo "NETLIFY_READ_TOKEN=$candidate" >> "$GITHUB_ENV"
              success=1
              echo "Netlify Git build accepted."
              break
            fi
            echo "Credential #${attempt} could not trigger the Git-linked build (HTTP ${http})."
          done
          if [ "$success" != "1" ]; then
            echo 'No configured Netlify credential can trigger a production build. Ensure builds are active and the token has site deploy permission.' >&2
            cat /tmp/netlify-build.json >&2 2>/dev/null || true
            exit 22
          fi

      - name: Wait for exact Netlify commit to become ready
        shell: bash
        run: |
          set -euo pipefail
          deploy_id=""
          state=""
          for i in $(seq 1 150); do
            curl -fsS \
              -H "Authorization: Bearer ${NETLIFY_READ_TOKEN}" \
              "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys?branch=main&per_page=30" \
              -o /tmp/netlify-deploys.json
            result=$(node -e 'const fs=require("fs");const deploys=JSON.parse(fs.readFileSync("/tmp/netlify-deploys.json","utf8"));const expected=process.env.GITHUB_SHA;const match=Array.isArray(deploys)?deploys.find(d=>d.commit_ref===expected&&d.context==="production"):null;if(match)process.stdout.write([match.id||"",match.state||"",String(match.error_message||"").replace(/[\t\n]/g," ")].join("\t"));')
            if [ -n "$result" ]; then
              IFS=$'\t' read -r deploy_id state deploy_error <<< "$result"
              echo "Netlify deploy=${deploy_id} state=${state} attempt=${i}"
              if [ "$state" = "ready" ]; then break; fi
              if [ "$state" = "error" ]; then
                echo "Netlify deployment failed: ${deploy_error}" >&2
                exit 23
              fi
            else
              echo "Waiting for Netlify to register commit ${GITHUB_SHA}; attempt=${i}"
            fi
            if [ "$i" = "150" ]; then
              echo 'Netlify did not publish the exact Git commit within the bounded wait.' >&2
              exit 24
            fi
            sleep 5
          done
          test -n "$deploy_id"
          test "$state" = "ready"

      - name: Verify exact live revision and storefront routes
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          live=""
          for i in $(seq 1 36); do
            body=$(curl -fsS --max-time 20 "$NETLIFY_SITE_URL/netlify-deploy-health" || true)
            live=$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).revision||'')}catch{console.log('')}})")
            echo "attempt=$i expected=$expected live=$live"
            if [ "$live" = "$expected" ]; then break; fi
            sleep 5
          done
          test "$live" = "$expected"

          for route in / /women /men /kids /electronics /store '/api/storefront/products?limit=1&page=1' /dashboard /dashboard/command-centre /dashboard/fashion; do
            code=$(curl -sS -o /tmp/route.out -w '%{http_code}' --max-time 58 "$NETLIFY_SITE_URL$route" || true)
            echo "$route -> $code"
            if [ "$route" = "/dashboard/fashion" ]; then
              test "$code" = "200" -o "$code" = "307" -o "$code" = "308"
            else
              test "$code" = "200"
            fi
          done

          curl -fsS --max-time 58 "$NETLIFY_SITE_URL/api/storefront/products?limit=1&page=1" -o /tmp/catalogue.json
          node -e 'const fs=require("fs");const data=JSON.parse(fs.readFileSync("/tmp/catalogue.json","utf8"));if(!Array.isArray(data.products)||data.products.length<1)throw new Error("catalogue is empty");if(!data.products[0]?.id||!data.products[0]?.title)throw new Error("catalogue product is incomplete");console.log(`Catalogue OK: total=${data.total??"unknown"}, first=${data.products[0].title}`);'
