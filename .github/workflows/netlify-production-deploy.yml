name: Deploy BharatShop to Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "netlify.toml"
      - ".github/workflows/netlify-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

env:
  NETLIFY_SITE_ID: 75b5c168-6679-479d-b3a6-244e393fe1b0
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_PERSONAL_ACCESS_TOKEN || secrets.NETLIFY_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4

      - name: Require Netlify token
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' }}
        run: |
          echo "NETLIFY_AUTH_TOKEN is required for the production build trigger."
          exit 20

      - name: Inspect safe Netlify build linkage
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          site=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
          printf '%s' "$site" | jq '{
            id,
            name,
            git_provider,
            repo_url,
            repo_path,
            repo_branch,
            build_image,
            build_settings: {
              provider: .build_settings.provider,
              repo_path: .build_settings.repo_path,
              repo_branch: .build_settings.repo_branch,
              repo_url: .build_settings.repo_url,
              installation_id: .build_settings.installation_id,
              stop_builds: .build_settings.stop_builds,
              base: .build_settings.base,
              dir: .build_settings.dir,
              cmd: .build_settings.cmd
            },
            repo: {
              provider: .repo.provider,
              repo_path: .repo.repo_path,
              repo_branch: .repo.repo_branch,
              repo_url: .repo.repo_url,
              installation_id: .repo.installation_id,
              stop_builds: .repo.stop_builds
            },
            managed_dns: .managed_dns,
            manual_deploy: .manual_deploy,
            deploy_hook: .deploy_hook,
            processing_settings: .processing_settings
          }'

      - name: Stop after safe linkage inspection
        run: echo "Inspection only; no Netlify project settings or database data changed."
