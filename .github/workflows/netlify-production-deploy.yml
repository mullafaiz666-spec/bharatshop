name: Deploy BharatShop to Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

env:
  NETLIFY_SITE_ID: 75b5c168-6679-479d-b3a6-244e393fe1b0
  NETLIFY_ACCOUNT_ID: 6a77b005bb09f74e7b55c7d4
  NETLIFY_SITE_URL: https://bharatshop-35fd.netlify.app
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_PERSONAL_ACCESS_TOKEN || secrets.NETLIFY_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4

      - name: Require Netlify token
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' }}
        run: |
          echo "NETLIFY_AUTH_TOKEN is required to read the owner-authorized deployment channel."
          exit 20

      - name: Set up Node.js
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify existing Netlify project access
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          site=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
          printf '%s' "$site" | jq -e --arg id "$NETLIFY_SITE_ID" '.id == $id' >/dev/null
          printf '%s' "$site" | jq '{id,name,url,ssl_url}'

      - name: Read owner-authorized Netlify deployment channel
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        id: deploy_channel
        shell: bash
        run: |
          set -euo pipefail
          env_json=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/accounts/$NETLIFY_ACCOUNT_ID/env/CHATGPT_NETLIFY_DEPLOY_PROXY?site_id=$NETLIFY_SITE_ID")
          DEPLOY_PROXY=$(printf '%s' "$env_json" | jq -r '.values[] | select(.context == "all") | .value' | head -n 1)
          case "$DEPLOY_PROXY" in
            https://netlify-mcp.netlify.app/proxy/*) ;;
            *) echo "Owner-authorized Netlify deployment channel is unavailable."; exit 31 ;;
          esac
          echo "Owner-authorized Netlify deployment channel detected."
          echo "proxy=$DEPLOY_PROXY" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$DEPLOY_PROXY"

      - name: Deploy through owner-authorized Netlify channel
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        shell: bash
        env:
          DEPLOY_PROXY: ${{ steps.deploy_channel.outputs.proxy }}
        run: |
          set -euo pipefail
          npx -y @netlify/mcp@latest \
            --site-id "$NETLIFY_SITE_ID" \
            --proxy-path "$DEPLOY_PROXY"

      - name: Verify live Netlify storefront and catalogue
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            home_code=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 30 "$NETLIFY_SITE_URL/" || true)
            store_code=$(curl -sS -o /tmp/store.html -w '%{http_code}' --max-time 30 "$NETLIFY_SITE_URL/store" || true)
            catalogue_code=$(curl -sS -o /tmp/catalogue.json -w '%{http_code}' --max-time 58 "$NETLIFY_SITE_URL/api/storefront/products?limit=1&page=1" || true)
            echo "attempt=$attempt home=$home_code store=$store_code catalogue=$catalogue_code"
            if [ "$home_code" = "200" ] && [ "$store_code" = "200" ] && [ "$catalogue_code" = "200" ]; then
              grep -q "BharatShop" /tmp/home.html
              node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/catalogue.json', 'utf8'));
          if (!Array.isArray(data.products) || data.products.length < 1) throw new Error('catalogue is empty');
          if (!data.products[0]?.id || !data.products[0]?.title) throw new Error('catalogue product is incomplete');
          console.log(`Netlify catalogue OK: total=${data.total ?? 'unknown'}, first=${data.products[0].title}`);
          NODE
              exit 0
            fi
            echo "--- catalogue response ---"
            head -c 1000 /tmp/catalogue.json || true
            echo
            sleep 10
          done
          echo "Netlify production verification failed."
          exit 1
