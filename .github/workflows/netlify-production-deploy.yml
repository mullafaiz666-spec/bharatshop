name: Deploy BharatShop to Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "netlify.toml"
      - ".github/workflows/netlify-production-deploy.yml"

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

env:
  NETLIFY_SITE_ID: 75b5c168-6679-479d-b3a6-244e393fe1b0
  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_PERSONAL_ACCESS_TOKEN || secrets.NETLIFY_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4

      - name: Require Netlify token
        if: ${{ env.NETLIFY_AUTH_TOKEN == '' }}
        run: |
          echo "NETLIFY_AUTH_TOKEN is required for the production build trigger."
          exit 20

      - name: Verify Netlify token and BharatShop site access
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          user_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            https://api.netlify.com/api/v1/user)
          site_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
          echo "NETLIFY_USER_HTTP=$user_code"
          echo "BHARATSHOP_SITE_HTTP=$site_code"
          test "$user_code" = "200"
          test "$site_code" = "200"

      - name: Trigger Netlify production build from linked main branch
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        id: trigger
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS --fail-with-body \
            -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/builds?clear_cache=true&title=BharatShop-${GITHUB_SHA}" \
            -d '{}')
          build_id=$(printf '%s' "$response" | jq -r '.id // empty')
          deploy_id=$(printf '%s' "$response" | jq -r '.deploy_id // empty')
          test -n "$build_id"
          test -n "$deploy_id"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Netlify build accepted."

      - name: Verify resulting Netlify deploy becomes ready
        if: ${{ env.NETLIFY_AUTH_TOKEN != '' }}
        shell: bash
        env:
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            response=$(curl -sS --fail-with-body \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/deploys/$DEPLOY_ID")
            state=$(printf '%s' "$response" | jq -r '.state // empty')
            commit_ref=$(printf '%s' "$response" | jq -r '.commit_ref // empty')
            error_message=$(printf '%s' "$response" | jq -r '.error_message // empty')
            echo "NETLIFY_DEPLOY_STATE=$state"
            if [ "$state" = "ready" ]; then
              echo "NETLIFY_DEPLOY_COMMIT=$commit_ref"
              exit 0
            fi
            if [ "$state" = "error" ] || [ "$state" = "failed" ]; then
              echo "Netlify deploy failed: $error_message"
              exit 30
            fi
            sleep 5
          done
          echo "Netlify deploy did not reach ready state in the verification window."
          exit 31
