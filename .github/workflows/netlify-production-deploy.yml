name: Deploy BharatShop Netlify Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NETLIFY_SITE_URL: https://bharatshop-35fd.netlify.app
  NETLIFY_SITE_ID: 75b5c168-6679-479d-b3a6-244e393fe1b0
  NETLIFY_SITE_NAME: bharatshop-35fd

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Require the exact BharatShop Netlify target
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo 'NETLIFY_AUTH_TOKEN is missing.' >&2
            exit 21
          fi
          curl -fsS \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" \
            -o /tmp/netlify-site.json
          node - <<'NODE'
          const fs = require('fs');
          const site = JSON.parse(fs.readFileSync('/tmp/netlify-site.json', 'utf8'));
          const expectedName = process.env.NETLIFY_SITE_NAME;
          const expectedUrl = process.env.NETLIFY_SITE_URL;
          if (site.id !== process.env.NETLIFY_SITE_ID) {
            throw new Error(`Refusing deployment: unexpected Netlify site id ${site.id || 'missing'}`);
          }
          if (site.name !== expectedName) {
            throw new Error(`Refusing deployment: expected Netlify site ${expectedName}, got ${site.name || 'unknown'}`);
          }
          const url = String(site.ssl_url || site.url || '').replace(/\/$/, '');
          if (url !== expectedUrl) {
            throw new Error(`Refusing deployment: expected ${expectedUrl}, got ${url || 'missing'}`);
          }
          console.log(`Verified Netlify target: ${site.name} (${site.id})`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integrations

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          BHARATSHOP_BUILD_REVISION: ${{ github.sha }}
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Upload source to Netlify build API and wait for production deploy
        shell: bash
        run: |
          set -euo pipefail

          # Package only tracked source, then add a non-secret build revision file.
          # next.config.ts embeds COMMIT_SHA into BHARATSHOP_BUILD_REVISION so the
          # live runtime can prove exactly which Git commit was published.
          git archive --format=zip --output=/tmp/bharatshop-source.zip HEAD
          printf 'COMMIT_SHA=%s\n' "$GITHUB_SHA" > /tmp/.env.production.local
          (cd /tmp && zip -q bharatshop-source.zip .env.production.local)

          curl -fsS -X POST \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            -H 'Content-Type: application/zip' \
            --data-binary @/tmp/bharatshop-source.zip \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/builds?branch=main" \
            -o /tmp/netlify-build.json

          build_id=$(node -e "const d=require('/tmp/netlify-build.json');process.stdout.write(String(d.id||''))")
          deploy_id=$(node -e "const d=require('/tmp/netlify-build.json');process.stdout.write(String(d.deploy_id||''))")
          if [ -z "$build_id" ] || [ -z "$deploy_id" ]; then
            echo 'Netlify build API did not return build/deploy identifiers.' >&2
            cat /tmp/netlify-build.json
            exit 22
          fi
          echo "Netlify build=$build_id deploy=$deploy_id"

          for i in $(seq 1 150); do
            curl -fsS \
              -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
              "https://api.netlify.com/api/v1/deploys/${deploy_id}" \
              -o /tmp/netlify-deploy.json
            state=$(node -e "const d=require('/tmp/netlify-deploy.json');process.stdout.write(String(d.state||''))")
            error=$(node -e "const d=require('/tmp/netlify-deploy.json');process.stdout.write(String(d.error_message||''))")
            echo "Netlify deploy state=$state attempt=$i"
            if [ "$state" = "ready" ]; then
              break
            fi
            if [ "$state" = "error" ]; then
              echo "Netlify deployment failed: $error" >&2
              exit 23
            fi
            if [ "$i" = "150" ]; then
              echo 'Netlify deployment did not become ready within the bounded wait.' >&2
              exit 24
            fi
            sleep 5
          done

      - name: Verify exact live revision and core routes
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          live=""
          for i in $(seq 1 36); do
            body=$(curl -fsS --max-time 20 "$NETLIFY_SITE_URL/netlify-deploy-health" || true)
            live=$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).revision||'')}catch{console.log('')}})")
            echo "attempt=$i expected=$expected live=$live"
            if [ "$live" = "$expected" ]; then
              break
            fi
            sleep 5
          done
          test "$live" = "$expected"

          home_code=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 30 "$NETLIFY_SITE_URL/" || true)
          store_code=$(curl -sS -o /tmp/store.html -w '%{http_code}' --max-time 30 "$NETLIFY_SITE_URL/store" || true)
          catalogue_code=$(curl -sS -o /tmp/catalogue.json -w '%{http_code}' --max-time 58 "$NETLIFY_SITE_URL/api/storefront/products?limit=1&page=1" || true)
          dashboard_code=$(curl -sS -o /tmp/dashboard.html -w '%{http_code}' --max-time 58 "$NETLIFY_SITE_URL/dashboard" || true)
          command_code=$(curl -sS -o /tmp/command.html -w '%{http_code}' --max-time 58 "$NETLIFY_SITE_URL/dashboard/command-centre" || true)

          echo "home=$home_code store=$store_code catalogue=$catalogue_code dashboard=$dashboard_code command=$command_code"
          test "$home_code" = "200"
          test "$store_code" = "200"
          test "$catalogue_code" = "200"
          test "$dashboard_code" = "200"
          test "$command_code" = "200"
          grep -q "BharatShop" /tmp/home.html
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/catalogue.json', 'utf8'));
          if (!Array.isArray(data.products) || data.products.length < 1) throw new Error('catalogue is empty');
          if (!data.products[0]?.id || !data.products[0]?.title) throw new Error('catalogue product is incomplete');
          console.log(`Catalogue OK: total=${data.total ?? 'unknown'}, first=${data.products[0].title}`);
          NODE
