name: Deploy BharatShop Netlify Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

env:
  NETLIFY_SITE_URL: https://bharatshop-35fd.netlify.app
  NETLIFY_SITE_ID: 75b5c168-6679-479d-b3a6-244e393fe1b0
  NETLIFY_SITE_NAME: bharatshop-35fd

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_PERSONAL_ACCESS_TOKEN: ${{ secrets.NETLIFY_PERSONAL_ACCESS_TOKEN }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Require exact BharatShop Netlify target
        shell: bash
        run: |
          set -euo pipefail
          normalize_token() {
            printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }
          readable=0
          for raw_candidate in "${NETLIFY_AUTH_TOKEN:-}" "${NETLIFY_PERSONAL_ACCESS_TOKEN:-}" "${NETLIFY_TOKEN:-}"; do
            candidate="$(normalize_token "$raw_candidate")"
            [ -z "$candidate" ] && continue
            echo "::add-mask::$candidate"
            if curl -fsS -H "Authorization: Bearer ${candidate}" "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" -o /tmp/netlify-site.json; then
              echo "NETLIFY_READ_TOKEN=$candidate" >> "$GITHUB_ENV"
              readable=1
              break
            fi
          done
          if [ "$readable" != "1" ]; then
            echo 'No configured Netlify token can read the BharatShop production site.' >&2
            exit 21
          fi
          node -e 'const fs=require("fs");const site=JSON.parse(fs.readFileSync("/tmp/netlify-site.json","utf8"));const expectedName=process.env.NETLIFY_SITE_NAME;const expectedUrl=process.env.NETLIFY_SITE_URL;if(site.id!==process.env.NETLIFY_SITE_ID)throw new Error(`Refusing deployment: unexpected Netlify site id ${site.id||"missing"}`);if(site.name!==expectedName)throw new Error(`Refusing deployment: expected Netlify site ${expectedName}, got ${site.name||"unknown"}`);const url=String(site.ssl_url||site.url||"").replace(/\/$/,"");if(url!==expectedUrl)throw new Error(`Refusing deployment: expected ${expectedUrl}, got ${url||"missing"}`);console.log(`Verified Netlify target: ${site.name} (${site.id})`);'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run integration tests
        run: npm run test:integrations

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          BHARATSHOP_BUILD_REVISION: ${{ github.sha }}
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Deploy exact build with pinned Netlify CLI
        shell: bash
        env:
          BHARATSHOP_BUILD_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The site-level build API currently returns HTTP 404 for this project.
          # Use the repository's retained known-good CLI release so Netlify builds
          # and packages the Next.js runtime before publishing the exact checkout.
          npx --yes netlify-cli@27.5.2 deploy \
            --build \
            --prod \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_READ_TOKEN" \
            --message "BharatShop production ${GITHUB_SHA}"

      - name: Verify exact live revision and storefront routes
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          live=""
          for i in $(seq 1 48); do
            body=$(curl -fsS --max-time 20 "$NETLIFY_SITE_URL/netlify-deploy-health" || true)
            live=$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).revision||'')}catch{console.log('')}})")
            echo "attempt=$i expected=$expected live=$live"
            if [ "$live" = "$expected" ]; then break; fi
            sleep 5
          done
          test "$live" = "$expected"

          for route in / /women /men /kids /electronics /store '/api/storefront/products?limit=1&page=1' /dashboard /dashboard/command-centre /dashboard/fashion; do
            code=$(curl -sS -o /tmp/route.out -w '%{http_code}' --max-time 58 "$NETLIFY_SITE_URL$route" || true)
            echo "$route -> $code"
            if [ "$route" = "/dashboard/fashion" ]; then
              test "$code" = "200" -o "$code" = "307" -o "$code" = "308"
            else
              test "$code" = "200"
            fi
          done

          curl -fsS --max-time 58 "$NETLIFY_SITE_URL/api/storefront/products?limit=1&page=1" -o /tmp/catalogue.json
          node -e 'const fs=require("fs");const data=JSON.parse(fs.readFileSync("/tmp/catalogue.json","utf8"));if(!Array.isArray(data.products)||data.products.length<1)throw new Error("catalogue is empty");if(!data.products[0]?.id||!data.products[0]?.title)throw new Error("catalogue product is incomplete");console.log(`Catalogue OK: total=${data.total??"unknown"}, first=${data.products[0].title}`);'
