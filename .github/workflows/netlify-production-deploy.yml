name: Deploy BharatShop Netlify Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NETLIFY_SITE_URL: https://bharatshop-35fd.netlify.app
  NETLIFY_SITE_ID: 75b5c168-6679-479d-b3a6-244e393fe1b0
  NETLIFY_SITE_NAME: bharatshop-35fd
  NETLIFY_BUILD_HOOK_TITLE: BharatShop production CI

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Require the exact BharatShop Netlify target
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo 'NETLIFY_AUTH_TOKEN is missing.' >&2
            exit 21
          fi
          curl -fsS \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" \
            -o /tmp/netlify-site.json
          node - <<'NODE'
          const fs = require('fs');
          const site = JSON.parse(fs.readFileSync('/tmp/netlify-site.json', 'utf8'));
          const expectedName = process.env.NETLIFY_SITE_NAME;
          const expectedUrl = process.env.NETLIFY_SITE_URL;
          if (site.id !== process.env.NETLIFY_SITE_ID) {
            throw new Error(`Refusing deployment: unexpected Netlify site id ${site.id || 'missing'}`);
          }
          if (site.name !== expectedName) {
            throw new Error(`Refusing deployment: expected Netlify site ${expectedName}, got ${site.name || 'unknown'}`);
          }
          const url = String(site.ssl_url || site.url || '').replace(/\/$/, '');
          if (url !== expectedUrl) {
            throw new Error(`Refusing deployment: expected ${expectedUrl}, got ${url || 'missing'}`);
          }
          console.log(`Verified Netlify target: ${site.name} (${site.id})`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integrations

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          BHARATSHOP_BUILD_REVISION: ${{ github.sha }}
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Trigger linked Netlify production build
        shell: bash
        run: |
          set -euo pipefail

          # Build hooks are Netlify's supported way to ask an already-linked
          # Git repository to build a branch. Reuse one private hook so no hook
          # URL is ever committed to this public repository.
          curl -fsS \
            -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
            "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/build_hooks" \
            -o /tmp/netlify-build-hooks.json

          hook_url=$(node - <<'NODE'
          const fs = require('fs');
          const hooks = JSON.parse(fs.readFileSync('/tmp/netlify-build-hooks.json', 'utf8'));
          const match = Array.isArray(hooks)
            ? hooks.find((hook) => hook.title === process.env.NETLIFY_BUILD_HOOK_TITLE && hook.branch === 'main')
            : null;
          process.stdout.write(String(match?.url || ''));
          NODE
          )

          if [ -z "$hook_url" ]; then
            node - <<'NODE' >/tmp/netlify-build-hook-body.json
          const body = {
            title: process.env.NETLIFY_BUILD_HOOK_TITLE,
            branch: 'main',
          };
          process.stdout.write(JSON.stringify(body));
          NODE
            curl -fsS -X POST \
              -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/netlify-build-hook-body.json \
              "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/build_hooks" \
              -o /tmp/netlify-created-build-hook.json
            hook_url=$(node -e "const d=require('/tmp/netlify-created-build-hook.json');process.stdout.write(String(d.url||''))")
          fi

          if [ -z "$hook_url" ]; then
            echo 'Netlify did not provide a build-hook URL.' >&2
            exit 22
          fi

          echo "::add-mask::$hook_url"
          trigger_url="${hook_url}?trigger_branch=main&trigger_title=BharatShop+${GITHUB_SHA}"
          echo "::add-mask::$trigger_url"
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$trigger_url" \
            -o /tmp/netlify-hook-response.json
          echo "Netlify production build hook accepted for ${GITHUB_SHA}."

      - name: Wait for exact Netlify commit to become ready
        shell: bash
        run: |
          set -euo pipefail
          deploy_id=""
          state=""

          for i in $(seq 1 150); do
            curl -fsS \
              -H "Authorization: Bearer ${NETLIFY_AUTH_TOKEN}" \
              "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/deploys?branch=main&per_page=20" \
              -o /tmp/netlify-deploys.json

            result=$(node - <<'NODE'
          const fs = require('fs');
          const deploys = JSON.parse(fs.readFileSync('/tmp/netlify-deploys.json', 'utf8'));
          const expected = process.env.GITHUB_SHA;
          const match = Array.isArray(deploys)
            ? deploys.find((deploy) => deploy.commit_ref === expected && deploy.context === 'production')
            : null;
          if (match) process.stdout.write(`${match.id || ''}\t${match.state || ''}\t${match.error_message || ''}`);
          NODE
            )

            if [ -n "$result" ]; then
              IFS=$'\t' read -r deploy_id state deploy_error <<< "$result"
              echo "Netlify deploy=${deploy_id} state=${state} attempt=${i}"
              if [ "$state" = "ready" ]; then
                break
              fi
              if [ "$state" = "error" ]; then
                echo "Netlify deployment failed: ${deploy_error}" >&2
                exit 23
              fi
            else
              echo "Waiting for Netlify to register commit ${GITHUB_SHA}; attempt=${i}"
            fi

            if [ "$i" = "150" ]; then
              echo 'Netlify did not publish the exact Git commit within the bounded wait.' >&2
              exit 24
            fi
            sleep 5
          done

          test -n "$deploy_id"
          test "$state" = "ready"

      - name: Verify exact live revision and storefront routes
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          live=""
          for i in $(seq 1 36); do
            body=$(curl -fsS --max-time 20 "$NETLIFY_SITE_URL/netlify-deploy-health" || true)
            live=$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).revision||'')}catch{console.log('')}})")
            echo "attempt=$i expected=$expected live=$live"
            if [ "$live" = "$expected" ]; then
              break
            fi
            sleep 5
          done
          test "$live" = "$expected"

          home_code=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 30 "$NETLIFY_SITE_URL/" || true)
          women_code=$(curl -sS -o /tmp/women.html -w '%{http_code}' --max-time 30 "$NETLIFY_SITE_URL/women" || true)
          men_code=$(curl -sS -o /tmp/men.html -w '%{http_code}' --max-time 30 "$NETLIFY_SITE_URL/men" || true)
          kids_code=$(curl -sS -o /tmp/kids.html -w '%{http_code}' --max-time 30 "$NETLIFY_SITE_URL/kids" || true)
          electronics_code=$(curl -sS -o /tmp/electronics.html -w '%{http_code}' --max-time 30 "$NETLIFY_SITE_URL/electronics" || true)
          store_code=$(curl -sS -o /tmp/store.html -w '%{http_code}' --max-time 30 "$NETLIFY_SITE_URL/store" || true)
          catalogue_code=$(curl -sS -o /tmp/catalogue.json -w '%{http_code}' --max-time 58 "$NETLIFY_SITE_URL/api/storefront/products?limit=1&page=1" || true)
          dashboard_code=$(curl -sS -o /tmp/dashboard.html -w '%{http_code}' --max-time 58 "$NETLIFY_SITE_URL/dashboard" || true)
          command_code=$(curl -sS -o /tmp/command.html -w '%{http_code}' --max-time 58 "$NETLIFY_SITE_URL/dashboard/command-centre" || true)

          echo "home=$home_code women=$women_code men=$men_code kids=$kids_code electronics=$electronics_code store=$store_code catalogue=$catalogue_code dashboard=$dashboard_code command=$command_code"
          test "$home_code" = "200"
          test "$women_code" = "200"
          test "$men_code" = "200"
          test "$kids_code" = "200"
          test "$electronics_code" = "200"
          test "$store_code" = "200"
          test "$catalogue_code" = "200"
          test "$dashboard_code" = "200"
          test "$command_code" = "200"
          grep -q "BHARATSHOP\|BharatShop" /tmp/home.html
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/catalogue.json', 'utf8'));
          if (!Array.isArray(data.products) || data.products.length < 1) throw new Error('catalogue is empty');
          if (!data.products[0]?.id || !data.products[0]?.title) throw new Error('catalogue product is incomplete');
          console.log(`Catalogue OK: total=${data.total ?? 'unknown'}, first=${data.products[0].title}`);
          NODE
