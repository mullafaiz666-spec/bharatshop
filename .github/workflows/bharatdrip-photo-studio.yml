name: BharatShop Fashion Photo Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "25 */6 * * *"
  push:
    branches: [main]
    paths:
      - 'src/lib/fashion/editorial-image.ts'
      - 'src/app/api/automation/fashion-photo-studio/**'
      - 'src/app/api/fashion-photo/**'
      - 'src/app/api/storefront/products/route.ts'
      - '.github/workflows/bharatdrip-photo-studio.yml'

concurrency:
  group: bharatshop-fashion-photo-studio
  cancel-in-progress: true

env:
  BHARATSHOP_URL: https://bharatshop-9w4a.onrender.com
  FASHION_EDITORIAL_STYLE: drip-realworld-v4

jobs:
  editorial-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for compatible Render revision
        run: |
          set -euo pipefail
          for i in $(seq 1 42); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$BHARATSHOP_URL/api/health" || true)
            revision=$(node -e "try{const d=require('/tmp/health.json');process.stdout.write(String(d.revision||''))}catch{}")
            echo "health=$code revision=$revision required=$GITHUB_SHA"
            if [ "$code" = "200" ] && [ -n "$revision" ]; then
              if [ "$revision" = "$GITHUB_SHA" ]; then exit 0; fi
              git fetch --quiet --no-tags origin "$revision" || true
              if git cat-file -e "$revision^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$revision"; then
                echo "Render is on descendant revision $revision containing required commit $GITHUB_SHA"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Render did not expose the required media revision or a descendant containing it"
          exit 1

      - name: Attempt photoreal fashion front refresh
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/automation/fashion-photo-studio" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data '{"views":[0],"productLimit":6,"externalAttemptLimit":2}' | tee fashion-photo-studio.json
          node - <<'NODE'
          const d=require('./fashion-photo-studio.json');
          if(!d.success) throw new Error(`Fashion studio failed: ${JSON.stringify(d)}`);
          if(d.styleVersion!==process.env.FASHION_EDITORIAL_STYLE) throw new Error(`Unexpected style version: ${d.styleVersion}`);
          console.log(JSON.stringify({status:d.status,styleVersion:d.styleVersion,attempted:d.attempted||0,generated:d.generated||0,cached:d.cached||0,photorealFrontReady:d.photorealFrontReady||0,totalProducts:d.totalProducts||0,waitingPhotorealUpgrade:d.waitingPhotorealUpgrade||0},null,2));
          if(Number(d.waitingPhotorealUpgrade||0)>0) console.log('Photoreal upgrades are pending; verified original artwork remains the approved zero-cost fallback.');
          NODE

      - name: Verify storefront fashion media policy
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --max-time 90 "$BHARATSHOP_URL/api/storefront/products?limit=96" | tee storefront.json
          node - <<'NODE'
          const d=require('./storefront.json');
          const expected=process.env.FASHION_EDITORIAL_STYLE;
          if(d.fashionEditorialStyle!==expected) throw new Error(`Storefront fashion style gate mismatch: ${d.fashionEditorialStyle}`);
          const products=Array.isArray(d.products)?d.products:[];
          const fashion=products.filter(p=>p.madeToOrder===true);
          const allowedStates=new Set(['PHOTOREAL_CURRENT','PHOTOREAL_UPGRADE_PENDING']);
          const bad=fashion.filter(p=>!allowedStates.has(String(p.editorialStyleState||''))||!/^https:\/\//i.test(String(p.imageUrl||''))||!Array.isArray(p.imageUrls)||p.imageUrls.length<4);
          if(bad.length) throw new Error(`Made-to-order fashion violated the approved media policy: ${JSON.stringify(bad.map(p=>({id:p.id,title:p.title,imageUrl:p.imageUrl,state:p.editorialStyleState,imageCount:Array.isArray(p.imageUrls)?p.imageUrls.length:0})))}`);
          console.log(JSON.stringify({visibleProducts:products.length,visibleFashion:fashion.length,style:expected,photorealCurrent:fashion.filter(p=>p.editorialStyleState==='PHOTOREAL_CURRENT').length,safeVerifiedPending:fashion.filter(p=>p.editorialStyleState==='PHOTOREAL_UPGRADE_PENDING').length},null,2));
          NODE

      - name: Verify visible fashion primary media matches editorial state
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/model-media.tsv
          const d=require('./storefront.json');
          for(const p of d.products||[]) if(p.madeToOrder===true) console.log(`${p.editorialStyleState}\t${p.imageUrl}`);
          NODE
          count=0
          while IFS=$'\t' read -r state image; do
            [ -z "$image" ] && continue
            curl -sS -D /tmp/model-headers.txt -o /tmp/model-image --fail --max-time 90 "$image"
            type=$(awk 'BEGIN{IGNORECASE=1}/^content-type:/{print $2}' /tmp/model-headers.txt | tr -d '\r' | tail -1)
            bytes=$(wc -c < /tmp/model-image | tr -d ' ')
            echo "fashion state=$state image=$image type=$type bytes=$bytes"
            if [ "$state" = "PHOTOREAL_CURRENT" ]; then
              case "$type" in image/png*|image/jpeg*|image/webp*) ;; *) echo "Current photoreal media must be raster, got $type"; exit 1;; esac
              test "$bytes" -gt 10000
            else
              case "$type" in image/svg+xml*|image/png*|image/jpeg*|image/webp*) ;; *) echo "Pending editorial fallback is not approved image media: $type"; exit 1;; esac
              test "$bytes" -gt 1000
            fi
            count=$((count+1))
          done < /tmp/model-media.tsv
          echo "verified visible fashion primary media=$count"
