name: BharatShop Fashion Photo Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "25 */6 * * *"
  push:
    branches: [main]
    paths:
      - 'src/lib/fashion/editorial-image.ts'
      - 'src/app/api/automation/fashion-photo-studio/**'
      - 'src/app/api/fashion-photo/**'
      - 'src/app/api/storefront/products/route.ts'
      - '.github/workflows/bharatdrip-photo-studio.yml'

concurrency:
  group: bharatshop-fashion-photo-studio
  cancel-in-progress: true

env:
  BHARATSHOP_URL: https://bharatshop-9w4a.onrender.com
  FASHION_EDITORIAL_STYLE: drip-realworld-v4

jobs:
  editorial-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact Render revision
        run: |
          set -euo pipefail
          for i in $(seq 1 42); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$BHARATSHOP_URL/api/health" || true)
            revision=$(node -e "try{const d=require('/tmp/health.json');process.stdout.write(String(d.revision||''))}catch{}")
            echo "health=$code revision=$revision expected=$GITHUB_SHA"
            if [ "$code" = "200" ] && [ "$revision" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Attempt photoreal fashion front refresh
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/automation/fashion-photo-studio" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data '{"views":[0],"productLimit":6,"externalAttemptLimit":2}' | tee fashion-photo-studio.json
          node - <<'NODE'
          const d=require('./fashion-photo-studio.json');
          if(!d.success) throw new Error(`Fashion studio failed: ${JSON.stringify(d)}`);
          if(d.styleVersion!==process.env.FASHION_EDITORIAL_STYLE) throw new Error(`Unexpected style version: ${d.styleVersion}`);
          console.log(JSON.stringify({
            status:d.status,
            styleVersion:d.styleVersion,
            attempted:d.attempted||0,
            generated:d.generated||0,
            cached:d.cached||0,
            photorealFrontReady:d.photorealFrontReady||0,
            totalProducts:d.totalProducts||0,
            waitingPhotorealUpgrade:d.waitingPhotorealUpgrade||0
          },null,2));
          if(Number(d.waitingPhotorealUpgrade||0)>0) {
            console.log('Photoreal upgrades are still pending. Verified original fashion media remains customer-safe while the free photoreal upgrade waits for capacity.');
          }
          NODE

      - name: Verify storefront fashion media policy
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --max-time 90 "$BHARATSHOP_URL/api/storefront/products?limit=96" | tee storefront.json
          node - <<'NODE'
          const d=require('./storefront.json');
          const expected=process.env.FASHION_EDITORIAL_STYLE;
          if(d.fashionEditorialStyle!==expected) throw new Error(`Storefront fashion style gate mismatch: ${d.fashionEditorialStyle}`);
          const products=Array.isArray(d.products)?d.products:[];
          const fashion=products.filter(p=>p.madeToOrder===true);
          const bad=fashion.filter(p=>{
            const image=String(p.imageUrl||'');
            const currentPhoto=image.includes('/api/fashion-photo/')&&image.includes(`style=${expected}`)&&p.editorialStyleState==='PHOTOREAL_CURRENT';
            const safeOriginal=image.includes('/api/fashion-art/')&&image.includes(`style=${expected}`)&&p.editorialStyleState==='PHOTOREAL_UPGRADE_PENDING';
            return !currentPhoto&&!safeOriginal;
          });
          if(bad.length) throw new Error(`Made-to-order fashion violated the approved media policy: ${JSON.stringify(bad.map(p=>({id:p.id,title:p.title,imageUrl:p.imageUrl,state:p.editorialStyleState})))}`);
          console.log(JSON.stringify({visibleProducts:products.length,visibleFashion:fashion.length,style:expected,photorealCurrent:fashion.filter(p=>p.editorialStyleState==='PHOTOREAL_CURRENT').length,safeOriginalPending:fashion.filter(p=>p.editorialStyleState==='PHOTOREAL_UPGRADE_PENDING').length},null,2));
          NODE

      - name: Verify visible fashion primary images are raster media
        run: |
          set -euo pipefail
          node -e "const d=require('./storefront.json'); for(const p of d.products||[]) if(p.madeToOrder===true) console.log(p.imageUrl);" > /tmp/model-urls.txt
          count=0
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            curl -sS -D /tmp/model-headers.txt -o /tmp/model-image --fail --max-time 90 "$image"
            type=$(awk 'BEGIN{IGNORECASE=1}/^content-type:/{print $2}' /tmp/model-headers.txt | tr -d '\r' | tail -1)
            bytes=$(wc -c < /tmp/model-image | tr -d ' ')
            echo "fashion image=$image type=$type bytes=$bytes"
            case "$type" in image/png|image/jpeg|image/webp) ;; *) echo "Expected raster image, got $type"; exit 1;; esac
            test "$bytes" -gt 10000
            count=$((count+1))
          done < /tmp/model-urls.txt
          echo "verified visible fashion raster images=$count"
