name: BharatDrip AI Photo Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * *"
  push:
    branches: [main]
    paths:
      - 'src/lib/fashion/editorial-image.ts'
      - 'src/app/api/automation/fashion-photo-studio/**'
      - 'src/app/api/fashion-photo/**'
      - 'src/app/api/storefront/products/route.ts'
      - 'android-app/**'
      - '.github/workflows/bharatdrip-photo-studio.yml'

concurrency:
  group: bharatdrip-ai-photo-studio
  cancel-in-progress: true

env:
  BHARATSHOP_URL: https://bharatshop-9w4a.onrender.com
  BHARATDRIP_EDITORIAL_STYLE: street-editorial-v2

jobs:
  model-photography:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for exact Render revision
        run: |
          set -euo pipefail
          for i in $(seq 1 42); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$BHARATSHOP_URL/api/health" || true)
            revision=$(node -e "try{const d=require('/tmp/health.json');process.stdout.write(String(d.revision||''))}catch{}")
            echo "health=$code revision=$revision expected=$GITHUB_SHA"
            if [ "$code" = "200" ] && [ "$revision" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Generate or reattach current BharatDrip urban model photography
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/automation/fashion-photo-studio" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data '{"limit":4}' | tee fashion-photo-studio.json
          node - <<'NODE'
          const d=require('./fashion-photo-studio.json');
          if(!d.success) throw new Error(`Photo studio failed: ${JSON.stringify(d)}`);
          if(d.styleVersion!==process.env.BHARATDRIP_EDITORIAL_STYLE) throw new Error(`Unexpected style version: ${d.styleVersion}`);
          console.log(JSON.stringify({provider:d.provider,styleVersion:d.styleVersion,generated:d.generated,cachedRewired:d.cachedRewired,frontReady:d.frontReady,waitingRefresh:d.waitingRefresh,results:d.results},null,2));
          NODE

      - name: Verify every visible BharatDrip card uses current urban model photography
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --max-time 90 "$BHARATSHOP_URL/api/storefront/products?category=BharatDrip%20Streetwear&limit=24" | tee bharatdrip-storefront.json
          node - <<'NODE'
          const d=require('./bharatdrip-storefront.json');
          const products=Array.isArray(d.products)?d.products:[];
          const expected=process.env.BHARATDRIP_EDITORIAL_STYLE;
          if(d.bharatDripEditorialStyle!==expected) throw new Error(`Storefront style gate mismatch: ${d.bharatDripEditorialStyle}`);
          if(products.length<1) throw new Error('No current-style BharatDrip products are visible');
          const stale=products.filter(p=>!String(p.imageUrl||'').includes('/api/fashion-photo/')||!String(p.imageUrl||'').includes(`style=${expected}`));
          if(stale.length) throw new Error(`Visible BharatDrip cards still using stale/fallback photography: ${JSON.stringify(stale.map(p=>({id:p.id,title:p.title,imageUrl:p.imageUrl})))}`);
          console.log(JSON.stringify({bharatDripProducts:products.length,currentStyleProducts:products.length,style:expected,sample:products.map(p=>({id:p.id,title:p.title,imageUrl:p.imageUrl}))},null,2));
          NODE

      - name: Verify every live primary model image is fresh raster media
        run: |
          set -euo pipefail
          node -e "const d=require('./bharatdrip-storefront.json'); for(const p of d.products||[]) console.log(p.imageUrl);" > /tmp/model-urls.txt
          count=0
          while IFS= read -r image; do
            test -n "$image"
            curl -sS -D /tmp/model-headers.txt -o /tmp/model-image --fail --max-time 90 "$image"
            type=$(awk 'BEGIN{IGNORECASE=1}/^content-type:/{print $2}' /tmp/model-headers.txt | tr -d '\r' | tail -1)
            bytes=$(wc -c < /tmp/model-image | tr -d ' ')
            style=$(awk 'BEGIN{IGNORECASE=1}/^x-fashion-style:/{print $2}' /tmp/model-headers.txt | tr -d '\r' | tail -1)
            cache=$(awk 'BEGIN{IGNORECASE=1}/^cache-control:/{sub(/^cache-control:[[:space:]]*/,"");print}' /tmp/model-headers.txt | tr -d '\r' | tail -1)
            echo "model image=$image type=$type bytes=$bytes style=$style cache=$cache"
            case "$type" in image/png|image/jpeg|image/webp) ;; *) echo "Expected raster image, got $type"; exit 1;; esac
            test "$bytes" -gt 10000
            test "$style" = "$BHARATDRIP_EDITORIAL_STYLE"
            count=$((count+1))
          done < /tmp/model-urls.txt
          test "$count" -ge 1
