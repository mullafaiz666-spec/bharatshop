name: Build BharatShop Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        run: gradle -p android-app assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/BharatShop-v1.5.1.apk
          sha256sum dist/BharatShop-v1.5.1.apk | tee dist/BharatShop-v1.5.1.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BharatShop-Android-v1.5.1
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable v1.5.1 APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="bharatshop-android-v1.5.1"
          NOTES="BharatShop Android v1.5.1. Verified production runtime: https://bharatshop-9w4a.onrender.com. The APK uses Render while the new Netlify cutover is still awaiting exact-revision verification. Built from commit $GITHUB_SHA."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/BharatShop-v1.5.1.apk dist/BharatShop-v1.5.1.apk.sha256 --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" dist/BharatShop-v1.5.1.apk dist/BharatShop-v1.5.1.apk.sha256 --title "BharatShop Android v1.5.1" --notes "$NOTES"
          fi
