name: Build BharatShop Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        run: gradle -p android-app assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/BharatShop-latest.apk
          sha256sum dist/BharatShop-latest.apk | tee dist/BharatShop-latest.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BharatShop-Android-v1.1
          path: dist/*
          if-no-files-found: error
          retention-days: 30
