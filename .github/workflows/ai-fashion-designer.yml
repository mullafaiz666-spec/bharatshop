name: BharatShop AI Fashion Designer

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "BharatShop Studio + BharatDrip designs to create (3-24)"
        required: false
        default: "12"
  push:
    branches: [main]
    paths:
      - "src/app/api/fashion-designer/**"
      - "src/app/api/fashion-art/**"
      - "src/app/api/automation/ceo-cycle/**"
      - "src/app/api/agents/listing/**"
      - "src/app/api/storefront/products/**"
      - "src/lib/suppliers/qikink-rate-card.ts"
      - ".github/workflows/ai-fashion-designer.yml"

concurrency:
  group: bharatshop-ai-fashion-designer
  cancel-in-progress: true

env:
  BHARATSHOP_URL: https://bharatshop-9w4a.onrender.com

jobs:
  fashion-designer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for exact live revision
        run: |
          set -euo pipefail
          for i in $(seq 1 42); do
            code=$(curl -sS -o /tmp/h.json -w '%{http_code}' --max-time 20 "$BHARATSHOP_URL/api/health" || true)
            revision=$(node -e "try{const d=require('/tmp/h.json');process.stdout.write(String(d.revision||''))}catch{}")
            echo "health=$code revision=$revision expected=$GITHUB_SHA"
            if [ "$code" = "200" ] && [ "$revision" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          echo "Render did not expose the exact fashion workflow revision"
          exit 1

      - name: Create value and BharatDrip fashion
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
          DESIGN_COUNT: ${{ inputs.count || '12' }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          count="$DESIGN_COUNT"
          if [ "$count" -lt 3 ] 2>/dev/null; then count=3; fi
          if [ "$count" -gt 24 ] 2>/dev/null; then count=24; fi
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/fashion-designer" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data "{\"count\":$count}" | tee fashion-designer-result.json
          node - <<'NODE'
          const d=require('./fashion-designer-result.json');
          if(!d.success||Number(d.generated)<3) throw new Error(d.error||'fashion designer produced too few products');
          const results=d.results||[];
          const drip=results.filter(x=>x.brand==='BharatDrip'&&x.line==='DESIGNER'&&x.status!=='REJECTED_UNCOMPETITIVE_SOURCE');
          if(drip.length<3) throw new Error(`Only ${drip.length} BharatDrip designs passed production economics`);
          if(drip.some(x=>Number(x.sellingPriceInr)<599||Number(x.sellingPriceInr)>999)) throw new Error('BharatDrip price escaped 599-999 band');
          if(drip.filter(x=>Number(x.printPlacements)>=2).length<3) throw new Error('BharatDrip front/back placement costing was not applied');
          console.log(JSON.stringify({generated:d.generated,pricingPolicy:d.pricingPolicy,bharatDripEconomicallyViable:drip.length},null,2));
          NODE

      - name: CEO publication pass
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/automation/ceo-cycle?skipResearch=1" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" --data '{}' | tee ceo-fashion.json
          node - <<'NODE'
          const d=require('./ceo-fashion.json');
          const approved=(d.ceo&&d.ceo.approvedProducts)||[];
          const drip=approved.filter(x=>String(x.designOrigin)==='BharatDrip');
          if(drip.length<3) throw new Error(`CEO approved only ${drip.length} BharatDrip designs`);
          if(drip.some(x=>!x.madeToOrder||Number(x.imageCount)<4)) throw new Error('BharatDrip CEO evidence gate failed');
          console.log(JSON.stringify({ceoApprovedBharatDrip:drip.length},null,2));
          NODE

      - name: Verify BharatDrip is customer-visible
        run: |
          curl --silent --show-error --fail-with-body --max-time 120 "$BHARATSHOP_URL/api/storefront/products?category=BharatDrip%20Streetwear&limit=24" | tee bharatdrip-storefront.json
          node - <<'NODE'
          const d=require('./bharatdrip-storefront.json');
          const drip=(d.products||[]).filter(p=>p.madeToOrder&&String(p.brand)==='BharatDrip');
          if(drip.length<3) throw new Error(`Only ${drip.length} BharatDrip products are customer-visible`);
          if(drip.some(p=>Number(p.sellingPriceInr)<599||Number(p.sellingPriceInr)>999)) throw new Error('Customer-visible BharatDrip price is outside 599-999');
          if(drip.some(p=>!Array.isArray(p.imageUrls)||p.imageUrls.length<4)) throw new Error('Customer-visible BharatDrip gallery has fewer than four views');
          console.log(JSON.stringify({bharatDripLive:drip.length,products:drip.map(p=>({id:p.id,title:p.title,price:p.sellingPriceInr,brand:p.brand,images:p.imageUrls.length}))},null,2));
          NODE
