name: Verify Agent Suite v4 Production

on:
  push:
    branches:
      - verify/agent-suite-v4-production
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm search dependency
        env:
          SEARX_URL: https://bharatshop-searxng.onrender.com/search?q=BharatShop+readiness+probe&categories=general&format=json&language=en
        run: |
          set -uo pipefail
          for attempt in $(seq 1 3); do
            code=$(curl --silent --show-error --location --connect-timeout 15 --max-time 60 --output /tmp/searx.json --write-out '%{http_code}' "$SEARX_URL" || true)
            echo "SEARX_WARM_STATUS=$code"
            [ "$code" = "200" ] && break
            sleep 10
          done

      - name: Verify all 13 live agents
        env:
          HEALTH_URL: https://bharatshop-9w4a.onrender.com/api/health/agents
          EXPECTED_REVISION: cf60f1883867cd60627102d3c122030ffacab6fa
        run: |
          set -uo pipefail
          for attempt in $(seq 1 6); do
            echo "Agent readiness attempt $attempt"
            http=$(curl --silent --show-error --location --connect-timeout 15 --max-time 90 --output /tmp/readiness.json --write-out '%{http_code}' "$HEALTH_URL" || true)
            echo "HTTP_STATUS=$http"
            if node <<'NODE'
          const fs = require('fs');
          let data;
          try { data = JSON.parse(fs.readFileSync('/tmp/readiness.json', 'utf8')); }
          catch { process.exit(2); }
          const report = {
            service: data.service,
            suite: data.suite,
            revision: data.revision,
            allOperational: data.allOperational,
            summary: data.summary,
            infrastructure: data.infrastructure,
            agents: (data.agents || []).map(a => ({ id:a.id, status:a.status, ready:a.ready })),
          };
          console.log('READINESS_REPORT=' + JSON.stringify(report, null, 2));
          if (data.service !== 'BharatShop AI Company OS') process.exit(3);
          if (data.suite !== 'BharatShop Agent Suite v4') process.exit(4);
          if (data.verificationMode !== 'DEEP_LIVE_DEPENDENCY_PROBE') process.exit(5);
          if (data.revision !== process.env.EXPECTED_REVISION) process.exit(6);
          if (!data.summary || data.summary.total !== 13) process.exit(7);
          if (data.allOperational !== true || data.summary.allReady !== true || data.summary.ready !== 13 || (data.summary.blocked || []).length !== 0) process.exit(8);
          if (!(data.agents || []).every(a => a.ready === true && a.status === 'READY')) process.exit(9);
          console.log('ALL_13_AGENTS_READY=true');
          NODE
            then
              exit 0
            fi
            sleep 10
          done
          echo "Final readiness payload:"
          cat /tmp/readiness.json 2>/dev/null || true
          exit 1

      - name: Verify public status page
        env:
          STATUS_URL: https://bharatshop-9w4a.onrender.com/status/agents
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --location --connect-timeout 15 --max-time 90 --output /tmp/status.html --write-out '%{http_code}' "$STATUS_URL")
          echo "STATUS_PAGE_HTTP=$code"
          test "$code" = "200"
          grep -q "Live Agent Operations" /tmp/status.html
          grep -q "ALL OPERATIONAL" /tmp/status.html
