name: Verify Agent Suite v4 Production

on:
  push:
    branches:
      - verify/agent-suite-v4-production
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Diagnose SearXNG dependency
        env:
          SEARX_URL: https://bharatshop-searxng.onrender.com
        run: |
          set -uo pipefail
          echo "ROOT_STATUS=$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 --output /tmp/root.txt --write-out '%{http_code}' "$SEARX_URL/" || true)"
          head -c 600 /tmp/root.txt 2>/dev/null || true
          echo
          SEARCH_URL="$SEARX_URL/search?q=BharatShop+readiness+probe&categories=general&format=json&language=en"
          echo "SEARCH_STATUS=$(curl --silent --show-error --location --connect-timeout 15 --max-time 60 --output /tmp/search.txt --write-out '%{http_code}' "$SEARCH_URL" || true)"
          echo "SEARCH_BODY_BEGIN"
          head -c 4000 /tmp/search.txt 2>/dev/null || true
          echo
          echo "SEARCH_BODY_END"
          IMG_URL="$SEARX_URL/search?q=red+shirt&categories=images&format=json&language=en&engines=brave.images"
          echo "IMAGE_STATUS=$(curl --silent --show-error --location --connect-timeout 15 --max-time 60 --output /tmp/image.txt --write-out '%{http_code}' "$IMG_URL" || true)"
          echo "IMAGE_BODY_BEGIN"
          head -c 4000 /tmp/image.txt 2>/dev/null || true
          echo
          echo "IMAGE_BODY_END"
