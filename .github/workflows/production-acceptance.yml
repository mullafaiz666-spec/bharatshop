name: Production Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://bharatshop-9w4a.onrender.com
      BHARATSHOP_URL: https://bharatshop-9w4a.onrender.com
      RUN_CEO: "true"
      RUN_IMAGE_RESOLVER: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN != '' && 'true' || 'false' }}
      BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run live catalog maintenance before acceptance
        if: env.BHARATSHOP_AUTOMATION_TOKEN != ''
        run: |
          set -euo pipefail
          node scripts/catalog-live-bootstrap.mjs
      - name: Run production acceptance
        run: node scripts/production-acceptance.mjs
