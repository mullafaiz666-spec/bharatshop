name: Production Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bharatshop-production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://bharatshop-9w4a.onrender.com
      BHARATSHOP_URL: https://bharatshop-9w4a.onrender.com
      BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for live Render deployment
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "$BHARATSHOP_URL/api/health?deep=1" || true)
            echo "deep health HTTP=$code"
            cat /tmp/health.json || true
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Render deployment did not become deeply healthy within the acceptance wait window"
          exit 1
      - name: Run independent live production acceptance
        run: node scripts/production-acceptance-v2.mjs
