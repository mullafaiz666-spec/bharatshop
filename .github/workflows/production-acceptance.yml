name: Production Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bharatshop-production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Netlify is the primary production host. A repository variable can override
      # this later for an approved custom domain without changing the workflow.
      BASE_URL: ${{ vars.BHARATSHOP_PRODUCTION_URL || 'https://bharatshop-35fd.netlify.app' }}
      BHARATSHOP_URL: ${{ vars.BHARATSHOP_PRODUCTION_URL || 'https://bharatshop-35fd.netlify.app' }}
      BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show production acceptance target
        run: echo "Production acceptance target=$BHARATSHOP_URL"

      - name: Wait for exact production deployment
        run: |
          set -euo pipefail
          for i in $(seq 1 42); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$BHARATSHOP_URL/api/health" || true)
            revision=$(node -e "try{const d=require('/tmp/health.json');process.stdout.write(String(d.revision||''))}catch{}")
            echo "shallow health HTTP=$code revision=$revision expected=$GITHUB_SHA"
            # A deployed revision can truthfully return 503 while dependencies are
            # not ready. Treat exact revision visibility separately from readiness.
            if [ "$revision" = "$GITHUB_SHA" ] && { [ "$code" = "200" ] || [ "$code" = "503" ]; }; then break; fi
            if [ "$i" = "42" ]; then
              echo "Production did not expose the exact commit $GITHUB_SHA within the acceptance wait window"
              cat /tmp/health.json || true
              exit 1
            fi
            sleep 10
          done

      - name: Verify administrator runtime prerequisites
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/free-stack.json -w '%{http_code}' --max-time 30 "$BHARATSHOP_URL/api/health/free-stack?deep=1" || true)
          state=$(node - <<'NODE'
          const fs=require('fs');
          try {
            const d=JSON.parse(fs.readFileSync('/tmp/free-stack.json','utf8'));
            process.stdout.write(JSON.stringify({
              http:Number(process.env.HTTP_CODE||0),
              adminReady:d.admin?.ready===true,
              databaseConfigured:d.admin?.databaseConfigured===true,
              sessionSecretConfigured:d.admin?.sessionSecretConfigured===true,
              configuredAdminLogin:d.admin?.configuredAdminLogin===true,
              aiConfigured:d.ai?.configured===true,
              aiProvider:d.ai?.provider||'',
              automationTokenConfigured:d.automation?.tokenConfigured===true,
            }));
          } catch { process.stdout.write(JSON.stringify({parseError:true})); }
          NODE
          )
          echo "admin runtime HTTP=$code $state"
          ready=$(printf '%s' "$state" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const d=JSON.parse(s);process.stdout.write(d.adminReady&&d.databaseConfigured&&d.sessionSecretConfigured?'1':'0')}catch{process.stdout.write('0')}})")
          if [ "$ready" != "1" ]; then
            echo "Administrator runtime prerequisites are not ready on production"
            cat /tmp/free-stack.json || true
            exit 1
          fi

      - name: Wait for dependent providers and AI model
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            code=$(curl -sS -o /tmp/deep-health.json -w '%{http_code}' --max-time 45 "$BHARATSHOP_URL/api/health?deep=1" || true)
            state=$(node - <<'NODE'
          const fs=require('fs');
          try{
            const d=JSON.parse(fs.readFileSync('/tmp/deep-health.json','utf8'));
            const r=d.readiness||{};
            const ready=Boolean(r.postgres?.ready&&r.ai?.ready&&r.ai?.modelReady&&r.vision?.ready&&r.searxng?.ready);
            process.stdout.write(JSON.stringify({
              ready,
              revision:d.revision||'',
              postgres:r.postgres?.ready===true,
              postgresReason:r.postgres?.reason||'',
              ai:r.ai?.ready===true,
              modelReady:r.ai?.modelReady===true,
              aiReason:r.ai?.reason||'',
              vision:r.vision?.ready===true,
              visionReason:r.vision?.reason||'',
              searxng:r.searxng?.ready===true,
              searxngReason:r.searxng?.reason||''
            }));
          }catch{process.stdout.write(JSON.stringify({ready:false,parseError:true}));}
          NODE
            )
            echo "deep health HTTP=$code $state"
            ready=$(printf '%s' "$state" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).ready?'1':'0')}catch{process.stdout.write('0')}})")
            if [ "$code" = "200" ] && [ "$ready" = "1" ]; then exit 0; fi
            sleep 10
          done
          echo "Dependent providers did not become fully ready; refusing to run a false-negative acceptance pass"
          cat /tmp/deep-health.json || true
          exit 1

      - name: Prepare operational live catalog
        run: |
          set -euo pipefail
          test -n "$BHARATSHOP_AUTOMATION_TOKEN"
          AUTH=(-H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" -H "x-automation-token: $BHARATSHOP_AUTOMATION_TOKEN" -H "Content-Type: application/json")

          deodap_code=$(curl --silent --show-error --max-time 300 -o /tmp/deodap.json -w '%{http_code}' -X POST "$BHARATSHOP_URL/api/automation/deodap-bootstrap" "${AUTH[@]}" --data '{"limit":30,"maxPages":16}' || true)
          cat /tmp/deodap.json || true
          if [ "$deodap_code" != "200" ]; then
            deodap_rate_limited=$(node - <<'NODE'
          const fs=require('fs');
          try{
            const d=JSON.parse(fs.readFileSync('/tmp/deodap.json','utf8'));
            process.stdout.write(d.status==='BLOCKED_SUPPLIER_POLICY_EVIDENCE'&&Number(d.policy?.status)===429?'1':'0');
          }catch{process.stdout.write('0');}
          NODE
            )
            if [ "$deodap_code" = "503" ] && [ "$deodap_rate_limited" = "1" ]; then
              echo "DeoDap policy endpoint is rate-limited. Catalog was left unchanged; continuing core production acceptance without inventing supplier evidence."
            else
              echo "Unexpected DeoDap bootstrap failure: HTTP=$deodap_code"
              exit 1
            fi
          fi

          curl --silent --show-error --fail-with-body --max-time 45 -X POST "$BHARATSHOP_URL/api/automation/order-gate-status" "${AUTH[@]}" --data '{}' | tee /tmp/order-gate.json
          curl --silent --show-error --fail-with-body --max-time 60 -X POST "$BHARATSHOP_URL/api/automation/ceo-delegation" "${AUTH[@]}" --data '{}' | tee /tmp/ceo-delegation.json

      - name: Run strict live production acceptance
        run: node scripts/production-acceptance-v4.mjs

      - name: Verify zero-budget marketing surfaces
        run: node scripts/marketing-acceptance.mjs

      - name: Verify storefront privacy images categories and payment capability
        run: node scripts/storefront-privacy-acceptance.mjs

      - name: Verify Razorpay and Cashfree credentials without charging
        run: node scripts/payment-live-acceptance.mjs

      - name: Verify all agents and Meta integration
        run: node scripts/agent-suite-acceptance.mjs
