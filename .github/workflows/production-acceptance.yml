name: Production Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bharatshop-production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://bharatshop-9w4a.onrender.com
      BHARATSHOP_URL: https://bharatshop-9w4a.onrender.com
      BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
      # Intentionally NOT provided to this workflow. Human approval must never
      # be converted into an automatic approval by CI.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for Render deployment
        run: |
          set -euo pipefail
          # Deployment readiness must not repeatedly hammer external providers.
          # Strict deep provider checks run exactly once in the acceptance script.
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$BHARATSHOP_URL/api/health" || true)
            echo "shallow health HTTP=$code"
            cat /tmp/health.json || true
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Render deployment did not become shallow-healthy within the acceptance wait window"
          exit 1
      - name: Run strict live production acceptance
        run: node scripts/production-acceptance-v3.mjs
