name: Public catalogue connectivity probe
on:
  push:
    branches: [integration/jarvis-bharatshop-gateway-20261001]
    paths: [.github/workflows/catalogue-preview-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check public catalogue without credentials or database changes
        run: |
          node --input-type=module <<'NODE'
          const urls = [
            'https://bharatshop-9w4a.onrender.com/api/storefront/products?limit=2',
            'https://bharatshop-35fd.netlify.app/api/storefront/products?limit=2'
          ];
          await Promise.all(urls.map(async url => {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(45000) });
              const text = await response.text();
              let data;
              try { data = JSON.parse(text); } catch {}
              console.log(JSON.stringify({ url, status: response.status, total: data?.total, returnedProducts: data?.products?.length, contentType: response.headers.get('content-type') }));
            } catch (error) { console.log(JSON.stringify({ url, reachable: false, reason: error.name })); }
          }));
          NODE
