name: BharatShop Netlify Production Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: netlify-production
  cancel-in-progress: true

env:
  NETLIFY_SITE_URL: https://bharatshop-35fd.netlify.app
  NETLIFY_SITE_ID: 75b5c168-6679-479d-b3a6-244e393fe1b0
  NETLIFY_SITE_NAME: bharatshop-35fd

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_PERSONAL_ACCESS_TOKEN: ${{ secrets.NETLIFY_PERSONAL_ACCESS_TOKEN }}
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate repository before recovery
        run: |
          npm ci --no-audit --no-fund
          npm run test:integrations
          npm run typecheck
          BHARATSHOP_BUILD_REVISION="$GITHUB_SHA" npm run build
          npm run lint

      - name: Recover production through Netlify build API
        shell: bash
        run: |
          set -euo pipefail
          normalize_token() {
            printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'
          }
          token=""
          for raw_candidate in "${NETLIFY_AUTH_TOKEN:-}" "${NETLIFY_PERSONAL_ACCESS_TOKEN:-}" "${NETLIFY_TOKEN:-}"; do
            candidate="$(normalize_token "$raw_candidate")"
            [ -z "$candidate" ] && continue
            echo "::add-mask::$candidate"
            if curl -fsS -H "Authorization: Bearer ${candidate}" "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}" -o /tmp/netlify-site.json; then
              token="$candidate"
              break
            fi
          done
          [ -n "$token" ] || { echo 'No configured Netlify token can read the production site.' >&2; exit 21; }
          node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync("/tmp/netlify-site.json","utf8"));if(s.id!==process.env.NETLIFY_SITE_ID||s.name!==process.env.NETLIFY_SITE_NAME)throw new Error("Refusing recovery: wrong Netlify target");'

          git archive --format=zip --output=/tmp/bharatshop-source.zip HEAD
          printf 'COMMIT_SHA=%s\n' "$GITHUB_SHA" > /tmp/.env.production.local
          (cd /tmp && zip -q bharatshop-source.zip .env.production.local)
          curl -fsS -X POST -H "Authorization: Bearer ${token}" -H 'Content-Type: application/zip' --data-binary @/tmp/bharatshop-source.zip "https://api.netlify.com/api/v1/sites/${NETLIFY_SITE_ID}/builds?branch=main&title=Recovery%20${GITHUB_SHA}" -o /tmp/netlify-build.json
          deploy_id=$(node -e "const d=require('/tmp/netlify-build.json');process.stdout.write(String(d.deploy_id||''))")
          [ -n "$deploy_id" ] || { echo 'Netlify recovery build was not accepted.' >&2; exit 22; }

          for i in $(seq 1 150); do
            curl -fsS -H "Authorization: Bearer ${token}" "https://api.netlify.com/api/v1/deploys/${deploy_id}" -o /tmp/netlify-deploy.json
            state=$(node -e "const d=require('/tmp/netlify-deploy.json');process.stdout.write(String(d.state||''))")
            error=$(node -e "const d=require('/tmp/netlify-deploy.json');process.stdout.write(String(d.error_message||''))")
            echo "Netlify recovery state=$state attempt=$i"
            [ "$state" = "ready" ] && break
            [ "$state" = "error" ] && { echo "Netlify recovery failed: $error" >&2; exit 23; }
            [ "$i" = "150" ] && { echo 'Netlify recovery timed out.' >&2; exit 24; }
            sleep 5
          done

      - name: Verify recovered live revision
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          for i in $(seq 1 48); do
            live=$(curl -fsS --max-time 20 "$NETLIFY_SITE_URL/netlify-deploy-health" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).revision||'')}catch{console.log('')}})" || true)
            echo "attempt=$i expected=$expected live=$live"
            [ "$live" = "$expected" ] && exit 0
            sleep 5
          done
          exit 25
