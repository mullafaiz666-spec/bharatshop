# BharatShop free-stack catalog pipeline.
name: BharatShop Catalog Maintenance

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: bharatshop-catalog-maintenance
  cancel-in-progress: false

env:
  BHARATSHOP_URL: https://bharatshop-9w4a.onrender.com

jobs:
  maintain-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify production is reachable
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 30 --retry 3 --retry-delay 10 "$BHARATSHOP_URL/api/health"

      - name: Discover real product candidates
        env:
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BHARATSHOP_AUTOMATION_TOKEN"
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 240 --retry 2 --retry-delay 10 \
            -X POST "$BHARATSHOP_URL/api/automation/research-products" \
            -H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "x-automation-token: $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"limit":5}' | tee research-products.json

      - name: Verify supplier source evidence
        env:
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          sleep 10
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 --retry 2 --retry-delay 15 \
            -X POST "$BHARATSHOP_URL/api/automation/source-verify" \
            -H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "x-automation-token: $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"limit":3,"minMarginPct":35}' | tee source-verify.json

      - name: Enrich verified products with evidence-backed facts
        env:
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          sleep 10
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 --retry 2 --retry-delay 15 \
            -X POST "$BHARATSHOP_URL/api/automation/product-enrich" \
            -H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "x-automation-token: $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"limit":3}' | tee product-enrich.json

      - name: Enrich fashion evidence where applicable
        env:
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          sleep 10
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 --retry 2 --retry-delay 15 \
            -X POST "$BHARATSHOP_URL/api/catalog/fashion-enrich" \
            -H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "x-automation-token: $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"limit":3}' | tee fashion-enrich.json

      - name: Resolve verified product media
        env:
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          sleep 10
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 --retry 2 --retry-delay 15 \
            -X POST "$BHARATSHOP_URL/api/catalog/image-resolve" \
            -H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "x-automation-token: $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"limit":2}' | tee media-resolve.json

      - name: Run CEO review without duplicate research
        env:
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 --retry 2 --retry-delay 10 \
            -X POST "$BHARATSHOP_URL/api/automation/ceo-cycle?skipResearch=1" \
            -H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "x-automation-token: $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{}' | tee ceo-cycle.json

      - name: Verify storefront contract
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 120 --retry 3 --retry-delay 10 "$BHARATSHOP_URL/api/storefront/products?limit=96" | tee storefront.json
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('storefront.json','utf8'));
          if(!Array.isArray(d.products)) throw new Error('Storefront products contract is invalid');
          const unsafe=d.products.filter(p=>!Array.isArray(p.imageUrls)||p.imageUrls.length<4||p.imageUrls.some(u=>!/^https:\/\//i.test(String(u||''))));
          if(unsafe.length) throw new Error(`Published storefront contains ${unsafe.length} product(s) that violate the >=4 HTTPS media gate`);
          console.log(JSON.stringify({published:d.products.length,total:d.total,unsafe:unsafe.length},null,2));
          NODE
