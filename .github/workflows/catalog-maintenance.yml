name: BharatShop Catalog Maintenance

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/api/automation/deodap-bootstrap/route.ts'
      - 'src/app/api/automation/market-reprice/**'
      - 'src/app/api/automation/fashion-photo-studio/**'
      - 'src/app/api/automation/ceo-cycle/route.ts'
      - 'src/app/api/agents/listing/route.ts'
      - 'src/app/api/fashion-designer/**'
      - 'src/app/api/fashion-art/**'
      - 'src/app/api/fashion-photo/**'
      - 'src/lib/fashion/**'
      - 'src/app/api/storefront/products/route.ts'
      - 'src/lib/catalog/market-pricing.ts'
      - 'src/lib/suppliers/qikink-rate-card.ts'
      - '.github/workflows/catalog-maintenance.yml'

concurrency:
  group: bharatshop-catalog-maintenance
  cancel-in-progress: true

env:
  BHARATSHOP_URL: https://bharatshop-9w4a.onrender.com

jobs:
  maintain-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Wait for current Render revision
        run: |
          set -euo pipefail
          for i in $(seq 1 42); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$BHARATSHOP_URL/api/health" || true)
            revision=$(node -e "try{const d=require('/tmp/health.json');process.stdout.write(String(d.revision||''))}catch{}")
            echo "health=$code revision=$revision expected=$GITHUB_SHA"
            if [ "$code" = "200" ] && [ "$revision" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Expand verified DeoDap catalog
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 --retry 2 --retry-delay 10 \
            -X POST "$BHARATSHOP_URL/api/automation/deodap-bootstrap" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data '{"limit":30,"maxPages":16}' | tee deodap-bootstrap.json

      - name: Create or refresh market-priced BharatShop and BharatDrip fashion
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/fashion-designer" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data '{"count":12}' | tee fashion-designer.json
          node - <<'NODE'
          const d=require('./fashion-designer.json');
          if(!d.success || Number(d.generated)<8) throw new Error(`Fashion generation insufficient: ${JSON.stringify(d)}`);
          const value=(d.results||[]).filter(x=>x.line==='VALUE');
          const designer=(d.results||[]).filter(x=>x.line==='DESIGNER');
          const badValue=value.filter(x=>Number(x.sellingPriceInr)>599||Number(x.marginPct)<18);
          const badDesigner=designer.filter(x=>Number(x.sellingPriceInr)<599||Number(x.sellingPriceInr)>999||Number(x.marginPct)<18);
          if(badValue.length||badDesigner.length) throw new Error(`Fashion lane pricing regression: ${JSON.stringify({badValue,badDesigner})}`);
          if(designer.length<4) throw new Error(`BharatDrip designer lane missing: ${designer.length}`);
          console.log(JSON.stringify({fashionGenerated:d.generated,value:value.length,bharatDrip:designer.length,pricingPolicy:d.pricingPolicy},null,2));
          NODE

      - name: Try free-GPU BharatDrip editorial upgrade
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/automation/fashion-photo-studio" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data '{"externalAttemptLimit":2}' | tee fashion-photo-studio.json
          node - <<'NODE'
          const d=require('./fashion-photo-studio.json');
          console.log(JSON.stringify({provider:d.provider,externalGenerated:d.externalGenerated||0,localGenerated:d.localGenerated||0,cachedRewired:d.cachedRewired||0,frontReady:d.frontReady||0},null,2));
          NODE

      - name: Reprice or block uncompetitive supplier products
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          for round in 1 2; do
            curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
              -X POST "$BHARATSHOP_URL/api/automation/market-reprice" \
              -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
              --data '{"limit":6}' | tee "market-reprice-$round.json"
          done

      - name: Publish queued products through CEO round 1
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/automation/ceo-cycle?skipResearch=1" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" --data '{}' | tee ceo-cycle-1.json

      - name: Publish queued products through CEO round 2
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/automation/ceo-cycle?skipResearch=1" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" --data '{}' | tee ceo-cycle-2.json

      - name: Ensure zero-cost BharatDrip editorial media after publication
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/automation/fashion-photo-studio" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data '{"externalAttemptLimit":0}' | tee fashion-media-ready.json
          node - <<'NODE'
          const d=require('./fashion-media-ready.json');
          if(!d.success) throw new Error(`BharatDrip media not ready: ${JSON.stringify(d)}`);
          if(Number(d.frontReady)<4) throw new Error(`Only ${d.frontReady} BharatDrip front editorial assets are ready`);
          if(Number(d.waitingRefresh)!==0) throw new Error(`${d.waitingRefresh} BharatDrip products still lack current editorial media`);
          console.log(JSON.stringify({frontReady:d.frontReady,totalProducts:d.totalProducts,externalGenerated:d.externalGenerated||0,localGenerated:d.localGenerated||0,cachedRewired:d.cachedRewired||0},null,2));
          NODE

      - name: Require a substantial safe live catalog
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 120 --retry 3 --retry-delay 10 "$BHARATSHOP_URL/api/storefront/products?limit=192" | tee storefront.json
          node - <<'NODE'
          const d=require('./storefront.json');
          if(!Array.isArray(d.products)) throw new Error('Storefront products contract is invalid');
          const unsafe=d.products.filter(p=>!Array.isArray(p.imageUrls)||p.imageUrls.length<4||p.imageUrls.some(u=>!/^https:\/\//i.test(String(u||'')))||Number(p.sellingPriceInr)<=0||(!p.madeToOrder&&Number(p.stockCount)<=0));
          const fashion=d.products.filter(p=>p.madeToOrder&&['BharatShop Studio','BharatDrip'].includes(p.brand));
          const designer=fashion.filter(p=>p.brand==='BharatDrip');
          const badValue=fashion.filter(p=>p.brand==='BharatShop Studio'&&Number(p.sellingPriceInr)>599);
          const badDesigner=designer.filter(p=>Number(p.sellingPriceInr)<599||Number(p.sellingPriceInr)>999);
          if(d.products.length<12) throw new Error(`Storefront still too small: ${d.products.length} published`);
          if(fashion.length<8) throw new Error(`BharatShop fashion is not operational: ${fashion.length} live`);
          if(designer.length<4) throw new Error(`BharatDrip designer line is not live: ${designer.length}`);
          if(badValue.length||badDesigner.length) throw new Error(`Fashion pricing lanes invalid: ${JSON.stringify({badValue,badDesigner})}`);
          if(unsafe.length) throw new Error(`Published storefront contains ${unsafe.length} unsafe product(s)`);
          console.log(JSON.stringify({published:d.products.length,fashion:fashion.length,bharatDrip:designer.length,unsafe:unsafe.length},null,2));
          NODE

      - name: Optional free-search discovery after core catalog is operational
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          curl --silent --show-error --connect-timeout 10 --max-time 90 \
            -X POST "$BHARATSHOP_URL/api/automation/research-products" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data '{"limit":1}' | tee research-products.json
