name: BharatShop Catalog Maintenance

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/app/api/automation/deodap-bootstrap/route.ts'
      - 'src/app/api/automation/research-products/**'
      - 'src/app/api/automation/source-verify/**'
      - 'src/app/api/automation/product-enrich/**'
      - 'src/app/api/automation/market-reprice/**'
      - 'src/app/api/automation/fashion-photo-studio/**'
      - 'src/app/api/automation/ceo-cycle/route.ts'
      - 'src/app/api/catalog/image-resolve/**'
      - 'src/app/api/agents/source-verify/**'
      - 'src/app/api/agents/listing/route.ts'
      - 'src/app/api/fashion-designer/**'
      - 'src/app/api/fashion-art/**'
      - 'src/app/api/fashion-photo/**'
      - 'src/app/api/admin/fashion-studio/**'
      - 'src/app/dashboard/fashion/**'
      - 'src/components/FashionDesignerStudio.tsx'
      - 'src/lib/ai/media-resolver.ts'
      - 'src/lib/catalog/economics-policy.ts'
      - 'src/lib/catalog/market-pricing.ts'
      - 'src/lib/catalog/priority-coverage.ts'
      - 'src/lib/suppliers/universal-catalogue.ts'
      - 'src/lib/suppliers/marketplace-policy.ts'
      - 'src/lib/suppliers/qikink-rate-card.ts'
      - 'src/lib/fashion/**'
      - 'src/app/api/storefront/products/route.ts'
      - '.github/workflows/catalog-maintenance.yml'

concurrency:
  group: bharatshop-catalog-maintenance
  cancel-in-progress: true

env:
  BHARATSHOP_URL: https://bharatshop-9w4a.onrender.com

jobs:
  maintain-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Wait for current Render revision
        run: |
          set -euo pipefail
          for i in $(seq 1 42); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$BHARATSHOP_URL/api/health" || true)
            revision=$(node -e "try{const d=require('/tmp/health.json');process.stdout.write(String(d.revision||''))}catch{}")
            echo "health=$code revision=$revision expected=$GITHUB_SHA"
            if [ "$code" = "200" ] && [ "$revision" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Expand verified DeoDap catalog
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 --retry 2 --retry-delay 10 \
            -X POST "$BHARATSHOP_URL/api/automation/deodap-bootstrap" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data '{"limit":30,"maxPages":16}' | tee deodap-bootstrap.json

      - name: Discover priority fashion and big-ticket catalog
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/automation/research-products" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data '{"userId":1,"limit":64,"perQueryLimit":4}' | tee universal-research.json
          node - <<'NODE'
          const d=require('./universal-research.json');
          console.log(JSON.stringify({status:d.status,researched:d.researched,queriesScanned:d.queriesScanned,queriesSucceeded:d.queriesSucceeded,categoryCounts:d.categoryCounts,criticalCoverage:d.criticalCoverage,sourceCounts:d.sourceCounts},null,2));
          NODE

      - name: Verify fresh supplier candidates with critical coverage priority
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          for round in 1 2 3 4; do
            curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
              -X POST "$BHARATSHOP_URL/api/automation/source-verify" \
              -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
              --data '{"limit":8}' | tee "universal-source-verify-$round.json"
          done

      - name: Enrich source-verified priority products
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          for round in 1 2 3 4; do
            curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
              -X POST "$BHARATSHOP_URL/api/automation/product-enrich" \
              -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
              --data '{"limit":8}' | tee "universal-enrich-$round.json"
          done

      - name: Resolve verified media for priority products
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          for round in 1 2 3 4; do
            curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
              -X POST "$BHARATSHOP_URL/api/catalog/image-resolve" \
              -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
              --data '{"limit":12}' | tee "universal-media-$round.json"
          done

      - name: Create or refresh BharatShop and BharatDrip fashion
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/fashion-designer" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data '{"count":12}' | tee fashion-designer.json
          node - <<'NODE'
          const d=require('./fashion-designer.json');
          if(!d.success || Number(d.generated)<8) throw new Error(`Fashion generation insufficient: ${JSON.stringify(d)}`);
          const value=(d.results||[]).filter(x=>x.line==='VALUE');
          const designer=(d.results||[]).filter(x=>x.line==='DESIGNER');
          const badValue=value.filter(x=>Number(x.sellingPriceInr)>599||Number(x.marginPct)<18);
          const badDesigner=designer.filter(x=>Number(x.sellingPriceInr)<599||Number(x.sellingPriceInr)>999||Number(x.marginPct)<18);
          if(badValue.length||badDesigner.length) throw new Error(`Fashion lane pricing regression: ${JSON.stringify({badValue,badDesigner})}`);
          if(designer.length<4) throw new Error(`BharatDrip designer lane missing: ${designer.length}`);
          console.log(JSON.stringify({fashionGenerated:d.generated,value:value.length,bharatDrip:designer.length,pricingPolicy:d.pricingPolicy},null,2));
          NODE

      - name: Try free-GPU BharatDrip editorial upgrade
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/automation/fashion-photo-studio" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data '{"views":[0,2],"productLimit":6,"externalAttemptLimit":2}' | tee fashion-photo-studio.json
          node - <<'NODE'
          const d=require('./fashion-photo-studio.json');
          console.log(JSON.stringify({status:d.status,photorealFrontReady:d.photorealFrontReady||0,totalProducts:d.totalProducts||0,waitingPhotorealUpgrade:d.waitingPhotorealUpgrade||0,generated:d.generated||0,cached:d.cached||0,mockupFallbacks:d.mockupFallbacks||0},null,2));
          NODE

      - name: Reprice or block uncompetitive supplier products
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          for round in 1 2; do
            curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
              -X POST "$BHARATSHOP_URL/api/automation/market-reprice" \
              -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
              --data '{"limit":8}' | tee "market-reprice-$round.json"
          done

      - name: Publish queued products through bounded CEO rounds
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          successes=0
          for round in 1 2 3; do
            if curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 270 \
              -X POST "$BHARATSHOP_URL/api/automation/ceo-cycle?skipResearch=1" \
              -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" --data '{}' | tee "ceo-cycle-$round.json"; then
              successes=$((successes+1))
            else
              echo "CEO round $round reached its request budget; continuing to the authoritative storefront coverage gate."
              break
            fi
          done
          echo "successful CEO rounds=$successes"

      - name: Refresh zero-cost fashion mockups and optional editorials
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 \
            -X POST "$BHARATSHOP_URL/api/automation/fashion-photo-studio" \
            -H "Authorization: Bearer $TOKEN" -H "x-automation-token: $TOKEN" -H "Content-Type: application/json" \
            --data '{"views":[0],"productLimit":12,"externalAttemptLimit":1}' | tee fashion-media-ready.json
          node - <<'NODE'
          const d=require('./fashion-media-ready.json');
          console.log(JSON.stringify({success:d.success,status:d.status,photorealFrontReady:d.photorealFrontReady||0,totalProducts:d.totalProducts||0,waitingPhotorealUpgrade:d.waitingPhotorealUpgrade||0,mockupFallbacks:d.mockupFallbacks||0},null,2));
          NODE

      - name: Require requested catalog coverage
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 120 --retry 3 --retry-delay 10 "$BHARATSHOP_URL/api/storefront/products?limit=96" | tee storefront.json
          node - <<'NODE'
          const d=require('./storefront.json');
          if(!Array.isArray(d.products)) throw new Error('Storefront products contract is invalid');
          const unsafe=d.products.filter(p=>{
            const required=p.madeToOrder?4:1;
            return !Array.isArray(p.imageUrls)||p.imageUrls.length<required||p.imageUrls.some(u=>!/^https:\/\//i.test(String(u||'')))||Number(p.sellingPriceInr)<=0||(!p.madeToOrder&&Number(p.stockCount)<=0);
          });
          const fashion=d.products.filter(p=>p.madeToOrder&&['BharatShop Studio','BharatDrip'].includes(p.brand));
          const designer=fashion.filter(p=>p.brand==='BharatDrip');
          const coverage=d.criticalCoverage||{};
          const required={fashion:8,tv:1,laptop:1,refrigerator:1,airConditioner:1,washingMachine:1};
          const missing=Object.entries(required).filter(([key,min])=>Number(coverage[key]||0)<min);
          if(Number(d.total||0)<12) throw new Error(`Storefront still too small: ${d.total} published`);
          if(Number(coverage.fashion||0)<8) throw new Error(`BharatShop fashion is not operational: ${coverage.fashion||0} live`);
          if(designer.length<1 && Number(coverage.fashion||0)>0) console.log('Designer items may be outside first page; total fashion coverage is authoritative.');
          if(unsafe.length) throw new Error(`Published storefront page contains ${unsafe.length} unsafe product(s)`);
          if(missing.length) throw new Error(`Critical catalog coverage missing: ${JSON.stringify({coverage,required,missing})}`);
          console.log(JSON.stringify({publishedTotal:d.total,pageProducts:d.products.length,criticalCoverage:coverage,required,categoryCount:d.categoryCount,unsafe:unsafe.length},null,2));
          NODE
