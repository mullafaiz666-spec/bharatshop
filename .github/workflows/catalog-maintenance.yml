# Live catalog verification for product discovery, media and enrichment.
name: BharatShop Catalog Maintenance

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: bharatshop-catalog-maintenance
  cancel-in-progress: false

env:
  BHARATSHOP_URL: https://bharatshop-9w4a.onrender.com

jobs:
  maintain-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Run live catalog bootstrap
        env:
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
          CATALOG_AUTOMATION_TIMEOUT_MS: 300000
        run: |
          set -euo pipefail
          test -n "$BHARATSHOP_AUTOMATION_TOKEN"
          node scripts/catalog-live-bootstrap.mjs | tee catalog-bootstrap.json

      - name: Discover real product candidates
        env:
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 180 --retry 1 --retry-delay 15 \
            -X POST "$BHARATSHOP_URL/api/automation/research-products" \
            -H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "x-automation-token: $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"limit":5}' | tee research-products.json

      - name: Resolve complete product media
        env:
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 --retry 1 --retry-delay 30 \
            -X POST "$BHARATSHOP_URL/api/catalog/image-resolve" \
            -H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"limit":2}' | tee media-resolve.json
          node - <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('media-resolve.json','utf8'));
          const bad=(d.results||[]).filter(x=>["ERROR","VERIFICATION_FAILED"].includes(String(x.status)));
          const rateLimited=(d.results||[]).some(x=>String(x.status)==='SEARCH_ERROR' && /429|rate limit/i.test(String(x.error||'')));
          if(rateLimited){console.log('SearXNG rate limited this cycle; publication remains blocked and the next hourly cycle will retry.'); process.exit(0);}
          if(d.error||Number(d.errors||0)>0||bad.length) throw new Error(`Media resolver failure: ${JSON.stringify({error:d.error,errors:d.errors,bad})}`);
          NODE

      - name: Enforce real media publication gate
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('media-resolve.json','utf8'));
          const rateLimited=(d.results||[]).some(x=>String(x.status)==='SEARCH_ERROR' && /429|rate limit/i.test(String(x.error||'')));
          if(rateLimited){console.log('Publication gate deferred because SearXNG is in cooldown; no fake PASS emitted.'); process.exit(0);}
          const published=(d.results||[]).find(x=>x&&x.status==='COMPLETE_MEDIA_RESOLVED'&&x.publicationGate==='PASS'&&Number(x.imageCount)>=4&&Array.isArray(x.images)&&x.images.filter(i=>/^https:\/\//i.test(String(i?.url||''))&&Number(i?.confidence)>=0.75).length>=4);
          if(!published){console.error(JSON.stringify({resolver:d,research:fs.existsSync('research-products.json')?JSON.parse(fs.readFileSync('research-products.json','utf8')):null},null,2));throw new Error('CATALOG ACCEPTANCE GATE FAILED: no product has >=4 verified HTTPS images and publicationGate=PASS');}
          console.log(JSON.stringify({acceptedProductId:published.productId,product:published.product,verifiedImages:published.imageCount,publicationGate:published.publicationGate,provider:published.provider,imageUrls:published.images.map(i=>i.url)},null,2));
          NODE

      - name: Verify storefront has real published images
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 180 --retry 2 --retry-delay 10 "$BHARATSHOP_URL/api/storefront/products?limit=96" > storefront.json
          cat storefront.json
          node - <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('storefront.json','utf8'));
          if(!(d.products||[]).length){console.log('No publishable products yet; storefront correctly returned no fake catalog entries.'); process.exit(0);}
          const good=(d.products||[]).find(p=>Array.isArray(p.imageUrls)&&p.imageUrls.filter(u=>/^https:\/\//i.test(String(u||''))).length>=4&&/^https:\/\//i.test(String(p.imageUrl||'')));
          if(!good) throw new Error('STOREFRONT ACCEPTANCE GATE FAILED: published products exist but none exposes >=4 real HTTPS images');
          console.log(JSON.stringify({productId:good.id,sku:good.sku,title:good.title,imageUrl:good.imageUrl,imageUrls:good.imageUrls},null,2));
          NODE

      - name: Enrich clothing sizes and variants
        env:
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --connect-timeout 15 --max-time 300 --retry 1 --retry-delay 15 \
            -X POST "$BHARATSHOP_URL/api/catalog/fashion-enrich" \
            -H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"limit":50}' | tee fashion-enrich.json
          node - <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('fashion-enrich.json','utf8')); const bad=(d.results||[]).filter(x=>["ERROR"].includes(String(x.status))); if(d.error||Number(d.errors||0)>0||bad.length) throw new Error(`Fashion enrichment failure: ${JSON.stringify({error:d.error,errors:d.errors,bad})}`);
          NODE
