# Live catalog verification for product media and enrichment.
name: BharatShop Catalog Maintenance

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: bharatshop-catalog-maintenance
  cancel-in-progress: false

jobs:
  maintain-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run live catalog bootstrap
        env:
          BHARATSHOP_URL: ${{ secrets.BHARATSHOP_URL }}
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BHARATSHOP_URL"
          test -n "$BHARATSHOP_AUTOMATION_TOKEN"
          node scripts/catalog-live-bootstrap.mjs

      - name: Resolve complete product media
        env:
          BHARATSHOP_URL: ${{ secrets.BHARATSHOP_URL }}
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          curl --silent --show-error --fail-with-body --retry 3 --retry-delay 5 \
            -X POST "$BHARATSHOP_URL/api/catalog/image-resolve" \
            -H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"limit":2}' > "$tmp"
          cat "$tmp"
          node - "$tmp" <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const badResults = Array.isArray(d.results)
            ? d.results.filter(x => ["ERROR"].includes(String(x.status)))
            : [];
          if (d.error || Number(d.errors || 0) > 0 || badResults.length > 0) {
            console.error("Catalog media resolver reported an application failure:", JSON.stringify({error:d.error, errors:d.errors, badResults}, null, 2));
            process.exit(1);
          }
          NODE

      - name: Enrich clothing sizes and variants
        env:
          BHARATSHOP_URL: ${{ secrets.BHARATSHOP_URL }}
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          curl --silent --show-error --fail-with-body --retry 3 --retry-delay 5 \
            -X POST "$BHARATSHOP_URL/api/catalog/fashion-enrich" \
            -H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"limit":200}' > "$tmp"
          cat "$tmp"
          node - "$tmp" <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const badResults = Array.isArray(d.results)
            ? d.results.filter(x => ["ERROR", "SEARCH_ERROR"].includes(String(x.status)))
            : [];
          if (d.error || Number(d.errors || 0) > 0 || badResults.length > 0) {
            console.error("Fashion enrichment reported an application failure:", JSON.stringify({error:d.error, errors:d.errors, badResults}, null, 2));
            process.exit(1);
          }
          NODE
