name: BharatShop Catalog Maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  maintain-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog bootstrap
        uses: actions/checkout@v4

      - name: Run live catalog bootstrap (research then maintenance)
        env:
          BHARATSHOP_URL: ${{ secrets.BHARATSHOP_URL }}
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          test -n "$BHARATSHOP_URL"
          test -n "$BHARATSHOP_AUTOMATION_TOKEN"
          node scripts/catalog-live-bootstrap.mjs

      - name: Resolve exact product images
        env:
          BHARATSHOP_URL: ${{ secrets.BHARATSHOP_URL }}
          BHARATSHOP_AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          test -n "$BHARATSHOP_URL"
          test -n "$BHARATSHOP_AUTOMATION_TOKEN"
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X POST "$BHARATSHOP_URL/api/catalog/image-resolve" \
            -H "Authorization: Bearer $BHARATSHOP_AUTOMATION_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"limit":50}'
