name: BharatShop Catalog Maintenance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  maintain-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Run live AI product research and publication
        env:
          BHARATSHOP_URL: ${{ secrets.BHARATSHOP_URL }}
          AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          test -n "$BHARATSHOP_URL"
          curl --fail-with-body --retry 3 --retry-delay 10 \
            -X POST "$BHARATSHOP_URL/api/automation/research-products" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $AUTOMATION_TOKEN" \
            --data '{"userId":1,"limit":6}'

      - name: Run automated image verification batch
        env:
          BHARATSHOP_URL: ${{ secrets.BHARATSHOP_URL }}
          AUTOMATION_TOKEN: ${{ secrets.BHARATSHOP_AUTOMATION_TOKEN }}
        run: |
          test -n "$BHARATSHOP_URL"
          curl --fail-with-body --retry 3 --retry-delay 10 \
            -X POST "$BHARATSHOP_URL/api/automation/catalog-maintenance" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $AUTOMATION_TOKEN" \
            --data '{"userId":1,"limit":10}'
