# BharatShop production transition configuration.
# Netlify serves the storefront shell and static assets natively. Until the
# guarded Render -> Supabase database copy is verified, database-backed API,
# dashboard and SSR product-detail requests remain on the known-good Render
# runtime. This avoids proxying the entire site through Render cold starts.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  node_bundler = "esbuild"

# The catalogue is the first request a shopper makes. Route it through a
# Netlify Function so it can wait up to the normal synchronous function limit
# for a sleeping free Render instance to wake, rather than the shorter external
# rewrite timeout.
[[redirects]]
  from = "/api/storefront/products"
  to = "/.netlify/functions/storefront-products-proxy"
  status = 200
  force = true

# Remaining backend endpoints stay on the authoritative Render runtime until
# the Supabase copy and native acceptance pass. Query strings are preserved.
[[redirects]]
  from = "/api/*"
  to = "https://bharatshop-9w4a.onrender.com/api/:splat"
  status = 200
  force = true

# Dashboard middleware verifies the administrator against PostgreSQL, so keep
# the dashboard on Render while the source database is authoritative.
[[redirects]]
  from = "/dashboard"
  to = "https://bharatshop-9w4a.onrender.com/dashboard"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard/*"
  to = "https://bharatshop-9w4a.onrender.com/dashboard/:splat"
  status = 200
  force = true

# Product detail pages currently render server-side from the catalogue DB.
# The main /store UI and its in-page product modal are native on Netlify.
[[redirects]]
  from = "/store/product/*"
  to = "https://bharatshop-9w4a.onrender.com/store/product/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# There is intentionally no catch-all Render rewrite. Netlify's Next.js adapter
# now serves /, /store, assets and non-database pages directly. Full native
# backend cutover remains guarded by BHARATSHOP_MIGRATION_VERIFIED=true.
