services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LLAMA_PORT:-8080}:8080"
    volumes:
      - ./models:/models
    command: >-
      -m /models/gemma-3-4b-it-Q4_K_M.gguf
      --mmproj /models/mmproj-gemma-3-4b-it-F16.gguf
      --alias gemma-3-4b-it
      --host 0.0.0.0
      --port 8080
      --ctx-size ${LLAMA_CTX_SIZE:-8192}
      --parallel ${LLAMA_PARALLEL:-2}
      --n-gpu-layers ${LLAMA_N_GPU_LAYERS:--1}

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      - llama-server
    environment:
      UPSTREAM_URL: http://llama-server:8080
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-}
      PORT: 8090
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8090}:8090"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - gateway
    command: tunnel --no-autoupdate --url http://gateway:8090
    profiles: [quick-tunnel]
